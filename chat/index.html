async function startChat(user) {
  if (!user?.id || chatStartedUserId === user.id) return;
  chatStartedUserId = user.id;

  const input = document.getElementById("message-input");
  const btn = document.getElementById("send-message-btn");
  const scroller = document.getElementById("message-scroller");
  await loadAndCacheAllUsers();
  await loadAvatarIndex();
  if (!currentUserGrade) currentUserGrade = localStorage.getItem(`carsongames-grade-${user.id}`) || "";
  await showGradePicker(!currentUserGrade);
  if (!currentUserGrade) await showGradePicker(true);
  await showSchoolPicker(false);
  await showChatRules();

  await loadChatNavigation(user);
  const inviteCode = new URLSearchParams(location.search).get("invite");
  if (inviteCode) {
    const joined = await backend.rpc("join_chat_server", { p_code: inviteCode });
    if (joined.error) uiAlert("Could not join server: " + joined.error.message);
    else { activeChatServerId = joined.data; activeChatChannelId = null; }
    history.replaceState({}, "", location.pathname);
    await loadChatNavigation(user);
  }
  listenForNewMessages(user);
  if (!pollExpiryInterval) {
    pollExpiryInterval = setInterval(() => {
      const now = Date.now();
      let changed = false;
      dbPublicMessages.forEach(poll => {
        if (poll.isPoll && poll.expires_at && new Date(poll.expires_at).getTime() <= now && !processedPollExpirations.has(poll.id)) {
          processedPollExpirations.add(poll.id);
          changed = true;
        }
      });
      if (changed) renderMessages();
    }, 15000);
  }
  scroller.addEventListener("scroll", handleScrollPagination);
  setupAutocompleteEngine(input);
  
  chatProfilePollInterval = setInterval(async () => {
    if (!currentUser) return;
    const { data: profile, error } = await backend.from("users").select("bannedUntil, mutedUntil, role, grade, tags").eq("id", currentUser.id).single();
    if (profile && !error) {
      const oldBannedUntil = currentUserBannedUntil;
      const oldMutedUntil = currentUserMutedUntil;
      currentUserBannedUntil = profile.bannedUntil || 0;
      currentUserMutedUntil = profile.mutedUntil || 0;
      currentUserRole = profile.role || "user";
      currentUserGrade = profile.grade || "";
      currentUserTags = normalizeProfileTags(profile.tags);

      const cachedUser = localUsersCache.find(item => item.id === currentUser.id);
      if (cachedUser) {
        cachedUser.grade = currentUserGrade;
        cachedUser.tags = currentUserTags;
      }
      
      if (currentUserBannedUntil && Date.now() < currentUserBannedUntil) {
        handleBannedUserDisplay();
      } else if (oldBannedUntil && oldBannedUntil > Date.now() && (!currentUserBannedUntil || currentUserBannedUntil <= Date.now())) {
        const inputRow = document.querySelector(".input-row");
        const inputField = document.getElementById("message-input");
        const sendBtn = document.getElementById("send-message-btn");
        if (inputRow) inputRow.style.display = "flex";
        if (inputField) inputField.disabled = false;
        if (sendBtn) sendBtn.disabled = false;
        
        if (currentUserMutedUntil && Date.now() < currentUserMutedUntil) {
          startCooldownTimer(currentUserMutedUntil);
        } else if (activeMuteInterval) {
          clearInterval(activeMuteInterval);
          activeMuteInterval = null;
          const textContainer = document.getElementById("cooldown-timer-text");
          if (textContainer) {
            textContainer.style.display = "none";
            textContainer.textContent = "";
          }
        }
        renderMessages();
      } else if ((!oldMutedUntil || oldMutedUntil <= Date.now()) && currentUserMutedUntil && Date.now() < currentUserMutedUntil) {
        startCooldownTimer(currentUserMutedUntil);
      }
    }
  }, 30000);

  btn.onclick = async () => {
    if (!hasAcceptedChatRules() || !currentUserGrade) {
      showLocalSystemMessage("You must agree to the rules and select a grade before using chat.", true);
      return;
    }
    if (currentUserBannedUntil && Date.now() < currentUserBannedUntil) {
      handleBannedUserDisplay();
      return;
    }
    
    let textToSend = input.value.trim();
    if (!textToSend) return;

    if (currentUserMutedUntil && Date.now() < currentUserMutedUntil) {
      startCooldownTimer(currentUserMutedUntil);
      return;
    }

    if (isDMView && activeChatConversationId) {
      const { error } = await backend.from("chat_dm_messages").insert({conversation_id:activeChatConversationId,sender_id:currentUser.id,content:textToSend});
      if (error) { showLocalSystemMessage(error.message || "Could not send DM.", true); return; }
      input.value = "";
      return;
    }

    if (isEditingMode) {
      try {
        const { error } = await backend
          .from(editingCollectionTarget)
          .update({ text: textToSend })
          .eq("id", editingMessageId);

        if (error) throw error;
      } catch (err) {
        console.error("Error writing message update modification:", err);
      }
      isEditingMode = false;
      editingMessageId = null;
      btn.textContent = "Send";
      input.value = "";
      return;
    }

    const replyMetadata = replyingToMessage ? {
      reply_to_id: replyingToMessage.id,
      reply_to_collection: replyingToMessage.collection,
      reply_to_username: replyingToMessage.username || "User",
      reply_to_text: replyingToMessage.text || ""
    } : {};
    replyingToMessage = null;

    const isAdminPlus = currentUserRole === "admin" || currentUserRole === "owner";
    const now = Date.now();
    if (!isAdminPlus && now - lastMessageTime < MESSAGE_COOLDOWN) return;

    input.value = "";
    lastMessageTime = now;
    requestNotificationPermissionInBackground();
    clearEphemeralSystemMessages();

    if (!isAdminPlus) {
      startCooldownTimer();
    }
    closePopover();

    if (textToSend.startsWith("/")) {
      const segments = textToSend.split(/\s+/);
      const commandKey = segments[0].toLowerCase();

      // Match complete usernames (longest first), so @First Last is treated
      // as one target instead of two separate command arguments.
      const knownUsernames = [...new Set(localUsersCache.map(u => u.username).filter(Boolean))]
        .sort((a, b) => b.length - a.length);
      function extractNamedTargets(source) {
        const targets = [];
        let normalized = source;
        const atMatches = [...source.matchAll(/@/g)].reverse();
        for (const match of atMatches) {
          const start = match.index + 1;
          const tail = source.slice(start);
          const username = knownUsernames.find(name =>
            tail.slice(0, name.length).toLowerCase() === name.toLowerCase() &&
            (tail.length === name.length || /[\s,!?;:]/.test(tail[name.length]))
          );
          if (!username) continue;
          targets.unshift(username.toLowerCase());
          normalized = normalized.slice(0, match.index) + "@" + username.replace(/\s+/g, "~space~") + normalized.slice(start + username.length);
        }
        return { targets, normalized };
      }

      const extractedTargets = extractNamedTargets(textToSend);
      let targetUsernames = extractedTargets.targets;
      let effectiveSegments = extractedTargets.normalized.split(/\s+/);

      // Keep backwards compatibility with commands that accept an untagged
      // single-word username.
      if (targetUsernames.length === 0 && segments.length > 1) {
        const firstArg = segments[1];
        const isDuration = /^\\d+(s|m|h|d|w|mo|y)$/i.test(firstArg);
        if (!isDuration && firstArg.length > 0) {
          targetUsernames.push(firstArg.replace(/[.,!?;:]+$/, '').toLowerCase());
          effectiveSegments = [segments[0], '@' + firstArg, ...segments.slice(2)];
        }
      }

      async function resolveTargetUser() {
        if (targetUsernames.length === 0) return null;
        const searchName = targetUsernames[0].replace(/~space~/g, " ");
        if (["me", "self"].includes(searchName) || searchName === currentUsername.toLowerCase()) {
          return {
            id: currentUser.id,
            username: currentUsername,
            role: currentUserRole,
            grade: currentUserGrade,
            tags: currentUserTags
          };
        }

        let found = localUsersCache.find(u => u.username && u.username.toLowerCase() === searchName);
        if (found) return found;

        const { data } = await backend
          .from("users")
          .select("id, username, role, grade, tags")
          .ilike("username", searchName)
          .maybeSingle();

        return data || null;
      }

      function checkRoleHierarchy(target) {
        if (!target) return false;
        if (target.id === currentUser.id) {
          showLocalSystemMessage("You cannot perform this action on yourself.", true);
          return false;
        }
        return true;
      }

      if (commandKey === "/poll") {
        const { data: canCreatePoll } = await backend.rpc("can_chat_channel_permission", { p_channel_id: activeChatChannelId, p_permission: "create_polls" });
        if (!isAdminPlus && !canCreatePoll) { showLocalSystemMessage("You do not have permission to create polls in this channel.", true); return; }
        const match = textToSend.match(/^\/poll\s+create\s+(\d+)(m|h|d|w)\s+(mc|sc)\s+title=(.+)$/i);
        if (!match) { showLocalSystemMessage("Syntax: /poll create 1d mc title=What is your gender?, Male, Female, Prefer not to say.", true); return; }
        const amount = Number(match[1]), unit = match[2].toLowerCase(), mode = match[3].toLowerCase();
        const body = match[4], comma = body.indexOf(",");
        if (!Number.isInteger(amount) || amount < 1 || comma < 1) { showLocalSystemMessage("Add a title and at least two comma-separated options.", true); return; }
        const title = body.slice(0, comma).trim();
        const options = body.slice(comma + 1).split(",").map(value => value.trim()).filter(Boolean);
        const duration = amount * ({m:60000,h:3600000,d:86400000,w:604800000}[unit] || 0);
        if (!title || title.length > 180 || options.length < 2 || options.length > 10 || duration <= 0 || duration > 30 * 86400000) {
          showLocalSystemMessage("Polls need a title, 2–10 options, and a duration between 1 minute and 30 days.", true); return;
        }
        if (new Set(options.map(value => value.toLowerCase())).size !== options.length || options.some(value => value.length > 100)) {
          showLocalSystemMessage("Poll options must be unique and no longer than 100 characters.", true); return;
        }
        const { data: poll, error } = await backend.from("chat_polls").insert({
          title, options, votes: {}, poll_mode: mode, created_by: currentUser.id,
          server_id: activeChatServerId, channel_id: activeChatChannelId,
          created_by_name: currentUsername, expires_at: new Date(Date.now() + duration).toISOString()
        }).select("*").single();
        if (error) { showLocalSystemMessage("Could not create poll: " + error.message, true); return; }
        dbPublicMessages.push(normalizeChatPoll(poll));
        renderMessages(true);
        showLocalSystemMessage("Poll created.", false);
        return;
      }

      if (commandKey === "/rules") {
        const rulesText = ["Current Chat & Omoggle Rules:", ...CHAT_RULES.map((rule, index) => `${index + 1}. ${rule}`), "", "Breaking any of these rules can result in a ban."].join("\n");
        showLocalSystemMessage(rulesText, false);
        return;
      }

      if (commandKey === "/help") {
        const available = EX_COMMANDS.filter(command => {
          if (["/admin", "/unadmin", "/owner", "/unowner"].includes(command.name)) return currentUserRole === "owner";
          if (["/subscription", "/deleteuser", "/clearstorage"].includes(command.name)) return isAdminPlus;
          if (["/ban", "/unban", "/permaban", "/kick", "/mute", "/unmute", "/warn", "/userinfo", "/tags", "/modlogs", "/serverinfo", "/stats", "/deleteall", "/poll"].includes(command.name)) return isAdminPlus;
          return true;
        }).map(command => `${command.name} - ${command.desc}`).join(" | ");
        showLocalSystemMessage(available, false);
        return;
      }

      if (commandKey === "/ping") {
        showLocalSystemMessage(`Pong. ${Math.max(0, Date.now() - now)}ms client response.`, false);
        return;
      }

      if (commandKey === "/who") {
        showLocalSystemMessage(`Known users: ${localUsersCache.map(user => `@${user.username}`).join(", ") || "none"}`, false);
        return;
      }

      if (commandKey === "/grade") {
        const grade = effectiveSegments[1]?.toLowerCase();
        if (!GRADE_TAGS[grade]) {
          showLocalSystemMessage("Syntax: /grade 6th, 7th, 8th, 9th, 10th, 11th, or 12th. A grade is required to use chat.", true);
          return;
        }
        const savedGrade = grade;
        const { error } = await backend.from("users").update({ grade: savedGrade }).eq("id", currentUser.id);
        currentUserGrade = savedGrade;
        localStorage.setItem(`carsongames-grade-${currentUser.id}`, savedGrade);
        if (error) showLocalSystemMessage("Grade saved locally. Add the grade column in NAGames backend to sync it across devices.", true);
        else showLocalSystemMessage(`Your chat tag is now ${savedGrade ? GRADE_TAGS[savedGrade].label : "off"}.`, false);
        renderMessages(true);
        return;
      }

      if (commandKey === "/tags") {
        const targetUser = await resolveTargetUser() || { id: currentUser.id, username: currentUsername, grade: currentUserGrade, tags: currentUserTags };
        const { data: targetProfile } = await backend.from("users").select("username, grade, tags").eq("id", targetUser.id).maybeSingle();
        const tags = profileTagsForUser(targetProfile || targetUser);
        showLocalSystemMessage(`Tags for @${targetProfile?.username || targetUser.username}: ${tags.length ? tags.map(tag => tag.label).join(", ") : "none"}`, false);
        return;
      }

      if (commandKey === "/tag") {
        const action = effectiveSegments[1]?.toLowerCase();
        const targetUser = await resolveTargetUser();
        if (!targetUser || !["give", "remove", "clear"].includes(action)) {
          showLocalSystemMessage("Syntax: /tag give @me tag-name color | /tag remove @me tag-name | /tag clear @me. Admins/Owners can target other users.", true);
          return;
        }
        const isSelfTagging = targetUser.id === currentUser.id;
        if (!isSelfTagging && !isAdminPlus) {
          showLocalSystemMessage("You can only manage your own tags. Admins and Owners can manage other users' tags.", true);
          return;
        }
        if (!isSelfTagging && !checkRoleHierarchy(targetUser)) return;
        const { data: targetProfile } = await backend.from("users").select("tags, grade, username").eq("id", targetUser.id).maybeSingle();
        let tags = normalizeProfileTags(targetProfile?.tags);
        if (action === "clear") {
          tags = [];
        } else {
          const label = effectiveSegments[3]?.replace(/^@/, "").slice(0, 24);
          if (!label) { showLocalSystemMessage("A tag name is required.", true); return; }
          if (action === "remove") {
            tags = tags.filter(tag => tag.label.toLowerCase() !== label.toLowerCase());
          } else {
            const colorNames = { red: "#f87171", blue: "#60a5fa", green: "#4ade80", yellow: "#facc15", pink: "#f472b6", purple: "#c084fc", white: "#f8fafc" };
            const color = colorNames[(effectiveSegments[4] || "purple").toLowerCase()] || (effectiveSegments[4] || "#c084fc");
            tags = [...tags.filter(tag => tag.label.toLowerCase() !== label.toLowerCase()), { label, color }].slice(-8);
          }
        }
        const { error } = await backend.from("users").update({ tags }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to update @${targetUser.username}'s tags: ${error.message}`, true); return; }
        showLocalSystemMessage(isSelfTagging ? "Your tags have been updated." : `Updated tags for @${targetUser.username}.`, false);
        if (!isSelfTagging) {
          await logModeratorEvent(`@${currentUsername} used /tag ${action} on @${targetUser.username}.`);
        }
        if (isSelfTagging) currentUserTags = tags;
        await loadAndCacheAllUsers();
        renderMessages(true);
        return;
      }

      if (commandKey === "/modlogs" && isAdminPlus) {
        const { data: logs, error } = await backend.from("whispers").select("text, timestamp").eq("type", "mod_log").order("timestamp", { ascending: false }).limit(20);
        if (error) { showLocalSystemMessage(`Failed to load moderator logs: ${error.message}`, true); return; }
        showLocalSystemMessage(logs?.length ? logs.map(log => `${new Date(log.timestamp || Date.now()).toLocaleString()}: ${log.text}`).join(" | ") : "No moderator events recorded.", false);
        return;
      }

      if (commandKey === "/stats") {
        if (!isAdminPlus) {
          showLocalSystemMessage("Only Admins and Owners can view user statistics.", true);
          return;
        }

        const { data: users, error } = await backend
          .from("users")
          .select("id, grade, role, tags");

        if (error || !users) {
          showLocalSystemMessage("Could not load user statistics: " + (error?.message || "No user data returned."), true);
          return;
        }

        const gradeCounts = {
          "6th": 0, "7th": 0, "8th": 0, "9th": 0,
          "10th": 0, "11th": 0, "12th": 0, "No grade": 0
        };
        const schoolCounts = { MMS: 0, IMS: 0, CMS: 0, NAI: 0, NASH: 0, "No school": 0 };
        const roleCounts = { Owner: 0, Admin: 0, User: 0 };

        users.forEach(user => {
          const grade = String(user.grade || "").trim().toLowerCase();
          if (Object.prototype.hasOwnProperty.call(gradeCounts, grade)) gradeCounts[grade]++;
          else gradeCounts["No grade"]++;

          const role = String(user.role || "user").toLowerCase();
          if (role === "owner") roleCounts.Owner++;
          else if (role === "admin") roleCounts.Admin++;
          else roleCounts.User++;

          const tags = Array.isArray(user.tags) ? user.tags : [];
          const schoolTag = tags.find(tag => tag && typeof tag === "object" && tag.type === "school");
          const school = String(schoolTag?.label || "").toUpperCase();
          if (Object.prototype.hasOwnProperty.call(schoolCounts, school)) schoolCounts[school]++;
          else schoolCounts["No school"]++;
        });

        const lines = [
          "NAGames User Statistics",
          `Total users: ${users.length}`,
          "",
          "By grade:",
          ...Object.entries(gradeCounts).map(([grade, count]) => `${grade === "No grade" ? grade : grade + " grade"}: ${count}`),
          "",
          "By school:",
          ...Object.entries(schoolCounts).map(([school, count]) => `${school}: ${count}`),
          "",
          "By role:",
          `Owners: ${roleCounts.Owner}`,
          `Admins: ${roleCounts.Admin}`,
          `Users: ${roleCounts.User}`
        ];
        showLocalSystemMessage(lines.join("\n"), false);
        return;
      }

      if (commandKey === "/serverinfo" && isAdminPlus) {
        showLocalSystemMessage(`Server info: ${allRegisteredUsers.length} cached users, ${dbPublicMessages.length} loaded public messages, ${dbPrivateMessages.length} loaded private messages.`, false);
        return;
      }

      if (commandKey === "/publicvc") {
        const roomId = "vc-pub-" + Math.random().toString(36).substring(2, 9);
        await backend.from("vc_rooms").insert([{ room_id: roomId, created_by: currentUsername, is_public: true }]);
        await backend.from("messages").insert([{
          text: `@${currentUsername} started a public voice chat!`,
          username: "Server",
          userId: null,
          role: "system",
          type: "vc_invite",
          room_id: roomId,
          server_id: activeChatServerId,
          channel_id: activeChatChannelId
        }]);
        joinVoiceRoom(roomId);
        return;
      }

      if (commandKey === "/privatevc") {
        const privateTargets = extractNamedTargets(textToSend).targets;
        let targetUsernamesPrivate = privateTargets.map(name => name.replace(/~space~/g, " "));
        
        if (targetUsernamesPrivate.length === 0) {
          targetUsernamesPrivate = segments.slice(1).map(value => value.replace(/^@/, "").replace(/[.,!?;:]+$/, "").toLowerCase()).filter(Boolean);
        }

        if (targetUsernamesPrivate.length === 0) {
          let i = 1;
          while (i < segments.length && segments[i].length > 0) {
            targetUsernamesPrivate.push(segments[i].replace(/[.,!?;:]+$/, '').toLowerCase());
            i++;
          }
        }

        if (targetUsernamesPrivate.length === 0) {
          showLocalSystemMessage("Syntax: /privatevc @username1 @username2", true);
          return;
        }

        const roomId = "vc-priv-" + Math.random().toString(36).substring(2, 9);
        const invitedList = [currentUsername, ...targetUsernamesPrivate].join(", ");

        const participantIds = [currentUser.id];
        for (const uname of targetUsernamesPrivate) {
            const u = localUsersCache.find(x => x.username.toLowerCase() === uname);
            if (u) participantIds.push(u.id);
        }

        await backend.from("vc_rooms").insert([{
          room_id: roomId,
          created_by: currentUsername,
          is_public: false,
          allowed_users: [currentUsername.toLowerCase(), ...targetUsernamesPrivate]
        }]);

        await backend.from("whispers").insert([{
          text: `@${currentUsername} started a private voice chat including: ${invitedList}`,
          username: "Server",
          senderId: currentUser.id,
          participants: participantIds,
          type: "vc_invite",
          room_id: roomId,
          role: "system"
        }]);

        joinVoiceRoom(roomId);
        return;
      }

      if (commandKey === "/mute" && isAdminPlus) {
        const targetUser = await resolveTargetUser();
        const durationStr = effectiveSegments[2];
        const durationMs = parseDurationString(durationStr);

        if (!targetUser || !durationMs) {
          showLocalSystemMessage("Syntax: /mute @username [time, e.g., 45s/30m/4h]", true);
          return;
        }
        if (!checkRoleHierarchy(targetUser)) return;

        const { error } = await backend.from("users").update({ "mutedUntil": Date.now() + durationMs }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to mute user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Muted user @${targetUser.username} for ${durationStr}.`, false);
        await logModeratorEvent(`@${currentUsername} used /mute on @${targetUser.username} for ${durationStr}.`);
        return;
      }

      if (commandKey === "/unmute" && isAdminPlus) {
        const targetUser = await resolveTargetUser();
        if (!targetUser) { showLocalSystemMessage("Syntax: /unmute @username", true); return; }
        const { error } = await backend.from("users").update({ "mutedUntil": 0 }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to unmute user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Unmuted user @${targetUser.username}.`, false);
        await logModeratorEvent(`@${currentUsername} used /unmute on @${targetUser.username}.`);
        return;
      }

      if (commandKey === "/userinfo" && isAdminPlus) {
        const targetUser = await resolveTargetUser();
        if (!targetUser) {
          showLocalSystemMessage("Syntax: /userinfo @username", true);
          return;
        }

        const { data: userRow, error } = await backend
          .from("users")
          .select("*")
          .eq("id", targetUser.id)
          .maybeSingle();

        if (error) {
          showLocalSystemMessage(`Failed to load @${targetUser.username}'s user row: ${error.message}`, true);
          return;
        }
        if (!userRow) {
          showLocalSystemMessage(`No database user row found for @${targetUser.username}.`, true);
          return;
        }

        const fields = Object.entries(userRow).map(([key, value]) => {
          let displayValue;
          if (value === null) displayValue = "null";
          else if (typeof value === "object") {
            try { displayValue = JSON.stringify(value); } catch (_) { displayValue = String(value); }
          } else {
            displayValue = String(value);
          }
          return `${key}=${displayValue}`;
        });

        if (userRow.createdAt !== undefined && userRow.createdAt !== null) {
          const createdDate = new Date(userRow.createdAt);
          if (!Number.isNaN(createdDate.getTime())) {
            fields.push(`createdAtReadable=${createdDate.toLocaleString()}`);
          }
        }

        // This is deliberately a local system message: it is never inserted into
        // messages/whispers, so other chat users cannot see the result.
        showLocalSystemMessage(`User info for @${userRow.username || targetUser.username}: ${fields.join(" | ")}`, false);
        await logModeratorEvent(`@${currentUsername} used /userinfo on @${userRow.username || targetUser.username}.`);
        return;
      }

      if (commandKey === "/ban" && isAdminPlus) {
        const targetUser = await resolveTargetUser();
        const durationStr = effectiveSegments[2];
        const durationMs = parseDurationString(durationStr);
        const reason = effectiveSegments.slice(3).join(" ") || "No explicit reason logged.";

        if (!targetUser || !durationMs) {
          showLocalSystemMessage("Syntax: /ban @username [time, e.g., 10s/2h/15d] [reason]", true);
          return;
        }
        if (!checkRoleHierarchy(targetUser)) return;

        const banTimestamp = Date.now() + durationMs;
        const { error } = await backend.from("users").update({ "bannedUntil": banTimestamp, "banReason": reason }).eq("id", targetUser.id);

        if (error) { showLocalSystemMessage(`Failed to ban user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Successfully banned @${targetUser.username} for ${durationStr}. Reason: ${reason}`, false);
        await logModeratorEvent(`@${currentUsername} banned @${targetUser.username} for ${durationStr}. Reason: ${reason}`);
        return;
      }

      if (commandKey === "/unban" && isAdminPlus) {
        const targetUser = await resolveTargetUser();
        if (!targetUser) { showLocalSystemMessage("Syntax: /unban @username", true); return; }
        const { error } = await backend.from("users").update({ "bannedUntil": 0, "banReason": null }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to unban user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Lifted ban from user @${targetUser.username}.`, false);
        await logModeratorEvent(`@${currentUsername} used /unban on @${targetUser.username}.`);
        return;
      }

      if (commandKey === "/permaban" && isAdminPlus) {
        const targetUser = await resolveTargetUser();
        if (!targetUser) { showLocalSystemMessage("Syntax: /permaban @username [reason]", true); return; }
        if (!checkRoleHierarchy(targetUser)) return;

        const reason = effectiveSegments.slice(2).join(" ") || "No explicit reason logged.";
        const permaTimestamp = Date.now() + (100 * 365 * 24 * 60 * 60 * 1000);

        const { error } = await backend.from("users").update({ "bannedUntil": permaTimestamp, "banReason": reason }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to permaban user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Permanently banned @${targetUser.username}. Reason: ${reason}`, false);
        await logModeratorEvent(`@${currentUsername} permanently banned @${targetUser.username}. Reason: ${reason}`);
        return;
      }

      if (commandKey === "/kick" && isAdminPlus) {
        const targetUser = await resolveTargetUser();
        if (!targetUser) { showLocalSystemMessage("Syntax: /kick @username [reason]", true); return; }
        if (!checkRoleHierarchy(targetUser)) return;

        const reason = effectiveSegments.slice(2).join(" ") || "No explicit reason logged.";
        const kickTimestamp = Date.now() + (2 * 60 * 1000);

        const { error } = await backend.from("users").update({ "bannedUntil": kickTimestamp, "banReason": reason }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to kick user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Kicked user @${targetUser.username} for 2 minutes. Reason: ${reason}`, false);
        await logModeratorEvent(`@${currentUsername} kicked @${targetUser.username} for 2 minutes. Reason: ${reason}`);
        return;
      }

      if (commandKey === "/admin" && currentUserRole === "owner") {
        const targetUser = await resolveTargetUser();
        if (!targetUser) { showLocalSystemMessage("Syntax: /admin @username", true); return; }
        if (!checkRoleHierarchy(targetUser)) return;
        const { error } = await backend.from("users").update({ role: "admin" }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to promote user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Promoted @${targetUser.username} to Admin.`, false);
        await logModeratorEvent(`@${currentUsername} promoted @${targetUser.username} to Admin.`);
        return;
      }

      if (commandKey === "/unadmin" && currentUserRole === "owner") {
        const targetUser = await resolveTargetUser();
        if (!targetUser) { showLocalSystemMessage("Syntax: /unadmin @username", true); return; }
        if (!checkRoleHierarchy(targetUser)) return;
        const { error } = await backend.from("users").update({ role: "user" }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to demote user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Demoted @${targetUser.username} to standard User level.`, false);
        await logModeratorEvent(`@${currentUsername} demoted @${targetUser.username} to User.`);
        return;
      }

      if (commandKey === "/owner" && currentUserRole === "owner") {
        const targetUser = await resolveTargetUser();
        if (!targetUser) { showLocalSystemMessage("Syntax: /owner @username", true); return; }
        if (!checkRoleHierarchy(targetUser)) return;
        const { error } = await backend.from("users").update({ role: "owner" }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to promote user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Promoted @${targetUser.username} to Owner privileges.`, false);
        await logModeratorEvent(`@${currentUsername} promoted @${targetUser.username} to Owner.`);
        return;
      }

      if (commandKey === "/unowner" && currentUserRole === "owner") {
        const targetUser = await resolveTargetUser();
        if (!targetUser) { showLocalSystemMessage("Syntax: /unowner @username", true); return; }
        if (!checkRoleHierarchy(targetUser)) return;
        const { error } = await backend.from("users").update({ role: "admin" }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to demote user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Demoted @${targetUser.username} to Admin.`, false);
        await logModeratorEvent(`@${currentUsername} demoted @${targetUser.username} to Admin.`);
        return;
      }

      if (commandKey === "/subscription" && isAdminPlus) {
        const targetUser = await resolveTargetUser();
        const chosenRank = effectiveSegments[2]?.toLowerCase();
        if (!targetUser || (chosenRank !== "basic" && chosenRank !== "premium")) { showLocalSystemMessage("Syntax: /subscription @username basic/premium", true); return; }
        const { error } = await backend.from("users").update({ rank: chosenRank }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to update subscription: ${error.message}`, true); return; }
        showLocalSystemMessage(`Updated subscription parameters for @${targetUser.username} to [${chosenRank}].`, false);
        await logModeratorEvent(`@${currentUsername} changed @${targetUser.username}'s subscription rank to ${chosenRank}.`);
        await loadAndCacheAllUsers();
        return;
      }

      if (commandKey === "/deleteuser" && isAdminPlus) {
        const targetUser = await resolveTargetUser();
        if (!targetUser) { showLocalSystemMessage("Syntax: /deleteuser @username", true); return; }
        const { error } = await backend.from("users").delete().eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to delete user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Purged user database records for user identity: @${targetUser.username}.`, false);
        await logModeratorEvent(`@${currentUsername} used /deleteuser on @${targetUser.username}.`);
        await loadAndCacheAllUsers();
        return;
      }

      if (commandKey === "/clearstorage" && isAdminPlus) {
        try {
          const storage = backend.storage.from("chat-files");
          const { data: rootItems, error: rootError } = await storage.list("", { limit: 1000, offset: 0 });
          if (rootError) throw rootError;

          const pathsToRemove = [];
          for (const item of rootItems || []) {
            if (!item?.name || item.name === "avatars") continue;

            // User uploads are stored inside one folder per user.
            if (item.id === null || item.metadata === null) {
              const { data: folderItems, error: folderError } = await storage.list(item.name, { limit: 1000, offset: 0 });
              if (folderError) throw folderError;
              for (const file of folderItems || []) {
                if (file?.name) pathsToRemove.push(`${item.name}/${file.name}`);
              }
            } else {
              pathsToRemove.push(item.name);
            }
          }

          let deletedCount = 0;
          for (let i = 0; i < pathsToRemove.length; i += 100) {
            const { error: removeError } = await storage.remove(pathsToRemove.slice(i, i + 100));
            if (removeError) throw removeError;
            deletedCount += Math.min(100, pathsToRemove.length - i);
          }

          showLocalSystemMessage(`Removed ${deletedCount} uploaded file(s). Profile pictures were preserved.`, false);
          await logModeratorEvent(`@${currentUsername} cleared chat uploads; preserved profile pictures.`);
        } catch (err) {
          console.error("Chat storage cleanup failed:", err);
          showLocalSystemMessage(`Storage cleanup failed: ${err.message}`, true);
        }
        return;
      }

      if (commandKey === "/deleteall" && isAdminPlus) {
        await backend.from("messages").delete().not('id', 'is', null);
        await backend.from("whispers").delete().not('id', 'is', null);
        showLocalSystemMessage("Database messages and whispers wiped. Profile pictures and storage files were not changed.", false);
        await logModeratorEvent(`@${currentUsername} used /deleteall.`);
        return;
      }

      if (commandKey === "/warn" && isAdminPlus) {
        const targetUser = await resolveTargetUser();
        const reason = effectiveSegments.slice(2).join(" ");
        if (!targetUser || !reason) { showLocalSystemMessage("Syntax: /warn @username [reason]", true); return; }
        
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const todayTimestamp = today.toISOString();
        
        let warnCount = 1;
        try {
            const { data: warnsToday } = await backend
                .from("whispers")
                .select("id")
                .contains("participants", [targetUser.id])
                .gte("timestamp", todayTimestamp)
                .ilike("text", "Warning %");
            if (warnsToday) warnCount = warnsToday.length + 1;
        } catch(e) { console.warn("Could not fetch warn count", e); }

        const warnText = `Warning ${warnCount}: ${reason}`;
        
        await backend.from("whispers").insert([{
            text: warnText,
            username: "Server",
            senderId: currentUser.id,
            participants: [currentUser.id, targetUser.id],
            role: "system"
        }]);
        
        showLocalSystemMessage(`Issued warning ${warnCount} to @${targetUser.username}.`, false);
        await logModeratorEvent(`@${currentUsername} warned @${targetUser.username}: ${reason}`);
        return;
      }

      if (commandKey === "/undo") {
        if (!lastActionLog) { showLocalSystemMessage("No valid local environment modifications recorded.", true); return; }
        try {
          if (lastActionLog.type === "delete") {
            await backend.from(lastActionLog.collection).insert([lastActionLog.data]);
            showLocalSystemMessage("Undo Executed: Restored deleted record.");
          } else if (lastActionLog.type === "edit") {
            await backend.from(lastActionLog.collection).update({ text: lastActionLog.data.text }).eq("id", lastActionLog.id);
            showLocalSystemMessage("Undo Executed: Reverted text modifications.");
          }
          lastActionLog = null;
        } catch(err) {
          showLocalSystemMessage("Failed to restore record.", true);
        }
        return;
      }

      if (!["/w", "/whisper", "/omoggle", "/publicvc", "/privatevc"].includes(commandKey)) {
        showLocalSystemMessage(`System Warning: Command '${commandKey}' is unrecognized or unauthorized.`, true);
        return;
      }
    }

    const segments = textToSend.split(/\s+/);
    const primaryCommandKey = segments[0].toLowerCase();
    const isWhisperCommand = primaryCommandKey === "/w" || primaryCommandKey === "/whisper";
    const isOmoggleCommand = primaryCommandKey === "/omoggle";
    let targetUsernames = [];
    let parsedText = textToSend;

    if (isOmoggleCommand && segments.length < 2) {
      showLocalSystemMessage("Usage: /omoggle @username — send a private Omoggle duel invitation.", true);
      return;
    }

    if (isOmoggleCommand && segments[1]) {
      const firstTarget = segments[1].replace(/^@/, "").replace(/[.,!?;:]+$/, "").toLowerCase();
      if (firstTarget === currentUsername.toLowerCase()) {
        showLocalSystemMessage("You can't send an Omoggle challenge to yourself. Choose another user.", true);
        return;
      }
    }

    if (isWhisperCommand || isOmoggleCommand) {
      let i = 1;
      while (i < segments.length) {
        let token = segments[i];
        if (token.startsWith("@")) {
          targetUsernames.push(token.substring(1).replace(/[.,!?;:]+$/, '').toLowerCase());
          i++;
        } else if (targetUsernames.length === 0) {
          targetUsernames.push(token.toLowerCase().replace(/[.,!?;:]+$/, ''));
          i++;
        } else {
          break;
        }
      }
      parsedText = segments.slice(i).join(" ");
    }

    const clientSideId = "msg-" + Date.now() + Math.random().toString(36).substring(2);

    const pendingMsgData = {
      text: isOmoggleCommand && !parsedText ? "Do you want to duel in Omoggle?" : parsedText,
      username: currentUsername,
      userId: user.id,
      senderId: user.id,
      avatar: currentUsername && currentUsername.length > 0 ? currentUsername[0].toUpperCase() : "U",
      timestamp: null,
      isPending: true,
      isWhisper: targetUsernames.length > 0,
      isOmoggleInvite: isOmoggleCommand,
      inviteStatus: isOmoggleCommand ? "pending" : null,
      isSystemMessage: isOmoggleCommand,
      role: currentUserRole,
      grade: currentUserGrade,
      tags: currentUserTags,
      clientSideId: clientSideId
    };

    localPendingQueue.push(pendingMsgData);
    renderMessages(true);

    try {
      if (targetUsernames.length > 0) {
        let participantIds = [user.id];

        for (const uname of targetUsernames) {
          let matchedUser = localUsersCache.find(u => u.username && u.username.toLowerCase() === uname);
          if (!matchedUser) {
            const { data: databaseUser, error: lookupError } = await backend
              .from("users")
              .select("id, username")
              .ilike("username", uname)
              .maybeSingle();
            if (lookupError) throw lookupError;
            matchedUser = databaseUser;
          }

          if (matchedUser && matchedUser.id !== user.id && !participantIds.includes(matchedUser.id)) {
            participantIds.push(matchedUser.id);
          }
        }

        if (participantIds.length === 1) {
          throw new Error(isOmoggleCommand
            ? "Couldn't find that username. Check the spelling and try /omoggle @username."
            : "No valid recipients found with those usernames.");
        }

        const challengePayload = {
          text: isOmoggleCommand && !parsedText ? "Do you want to duel in Omoggle?" : parsedText,
          username: currentUsername,
          senderId: user.id,
          avatar: currentUsername && currentUsername.length > 0 ? currentUsername[0].toUpperCase() : "U",
          participants: participantIds,
          role: currentUserRole,
          server_id: activeChatServerId,
          channel_id: activeChatChannelId,
          clientSideId: clientSideId,
          ...replyMetadata
        };

        if (isOmoggleCommand) {
          challengePayload.isOmoggleInvite = true;
          challengePayload.inviteStatus = "pending";
        }

        const { error } = await backend.from("whispers").insert([challengePayload]);
        if (error) throw error;
      } else {
        const { error } = await backend.from("messages").insert([{
          text: textToSend,
          username: currentUsername,
          userId: user.id,
          avatar: currentUsername && currentUsername.length > 0 ? currentUsername[0].toUpperCase() : "U",
          role: currentUserRole,
          clientSideId: clientSideId,
          ...replyMetadata
        }]);
        if (error) throw error;
      }
    } catch (err) {
      console.error("Error sending message:", err);
      showLocalSystemMessage(err.message || "Failed to deliver message payload channels.", true);
      localPendingQueue = localPendingQueue.filter(m => m.clientSideId !== clientSideId);
      renderMessages();
    }
  };
}

function updateAutocompleteCacheFromLoadedMessages() {
  const uniqueUsers = new Map();

  allRegisteredUsers.forEach(user => {
    uniqueUsers.set(user.id, user);
  });

  let allMessages = [...dbHistoricalMessages, ...dbPublicMessages, ...dbPrivateMessages];
  allMessages.forEach(msg => {
    // System/moderation messages often use username="Server" while retaining
    // the initiating user's ID. Never let those messages overwrite a real
    // account's username or role in the mention autocomplete cache.
    const messageUsername = String(msg.username || "").trim();
    if (!messageUsername || messageUsername.toLowerCase() === "server") return;

    if (msg.userId && msg.username) {
      const cachedUser = uniqueUsers.get(msg.userId);
      uniqueUsers.set(msg.userId, {
        ...cachedUser,
        id: msg.userId,
        username: cachedUser?.username || msg.username,
        avatar: cachedUser?.avatar || msg.avatar || msg.username[0].toUpperCase()
      });
    } else if (msg.senderId && msg.username) {
      const cachedUser = uniqueUsers.get(msg.senderId);
      uniqueUsers.set(msg.senderId, {
        ...cachedUser,
        id: msg.senderId,
        username: cachedUser?.username || msg.username,
        avatar: cachedUser?.avatar || msg.avatar || msg.username[0].toUpperCase()
      });
    }
  });

  localUsersCache = Array.from(uniqueUsers.values());
}

async function listenForNewMessages(user) {
  let initialPublic = null;
  let publicLoadError = null;

  const publicQuery = backend
    .from("messages")
    .select("id, text, username, userId, senderId, avatar, role, timestamp, type, room_id, participants, isOmoggleInvite, inviteStatus, reply_to_id, reply_to_collection, reply_to_username, reply_to_text, forward_of_id, forward_of_collection, forward_of_text, clientSideId, server_id, channel_id")
    .eq("server_id", activeChatServerId).eq("channel_id", activeChatChannelId)
    .order("timestamp", { ascending: false })
    .range(0, MESSAGE_PAGE_SIZE - 1);

  ({ data: initialPublic, error: publicLoadError } = await publicQuery);

  // Keep the bandwidth-optimized column list, but fall back to the original
  // full-row query if a schema mismatch ever occurs. This prevents a single
  // missing/renamed column from making the chat appear to endlessly reload.
  if (publicLoadError) {
    console.warn("Optimized message query failed; retrying with full rows:", publicLoadError);
    const fallback = await backend
      .from("messages")
      .select("*").eq("server_id", activeChatServerId).eq("channel_id", activeChatChannelId)
      .order("timestamp", { ascending: false })
      .range(0, MESSAGE_PAGE_SIZE - 1);
    initialPublic = fallback.data || null;
    publicLoadError = fallback.error || null;
  }

  if (publicLoadError) {
    console.error("Failed to load chat messages:", publicLoadError);
    // Mark the initial attempt as completed so the failsafe cannot reload the
    // entire page in a loop. The realtime subscription below can still connect.
    initialSnapshotReceived = true;
  } else if (initialPublic) {
    dbPublicMessages = initialPublic.map(m => ({ ...m, isWhisper: false, isSystemMessage: m.role === "system" })).reverse();
    initialSnapshotReceived = true;
    if (initialPublic.length < MESSAGE_PAGE_SIZE) allMessagesLoaded = true;
    historyPageOffset = dbPublicMessages.length;
    renderMessages();
  }

  const { data: initialPrivate } = await backend
    .from("whispers")
    .select("id, text, username, userId, senderId, avatar, role, timestamp, type, room_id, participants, isOmoggleInvite, inviteStatus, reply_to_id, reply_to_collection, reply_to_username, reply_to_text, forward_of_id, forward_of_collection, forward_of_text, clientSideId")
    .contains("participants", [user.id]);

  if (initialPrivate) {
    dbPrivateMessages = initialPrivate.map(m => ({ ...m, isWhisper: true, isSystemMessage: m.role === "system" || m.isOmoggleInvite === true }));
    renderMessages();
  }

  const { data: initialPolls, error: pollsLoadError } = await backend.from("chat_polls").select("*").eq("server_id",activeChatServerId).eq("channel_id",activeChatChannelId).order("created_at", { ascending: true }).limit(200);
  if (pollsLoadError) console.warn("Could not load chat polls:", pollsLoadError);
  if (initialPolls?.length) { dbPublicMessages.push(...initialPolls.map(normalizeChatPoll)); renderMessages(); }

  await removeBackendChannel(publicChannel);
  publicChannel = null;
  publicChannel = backend
    .channel('public:messages')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'channel_id=eq.' + activeChatChannelId }, payload => {
      const newMsg = { ...payload.new, isWhisper: false, isSystemMessage: payload.new.role === "system" };
      maybeNotifyForMention(newMsg);
      dbPublicMessages.push(newMsg);
      renderMessages(true);
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages', filter: 'channel_id=eq.' + activeChatChannelId }, payload => {
      dbPublicMessages = dbPublicMessages.filter(m => m.id !== payload.old.id);
      dbHistoricalMessages = dbHistoricalMessages.filter(m => m.id !== payload.old.id);
      renderMessages();
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages', filter: 'channel_id=eq.' + activeChatChannelId }, payload => {
      const idx = dbPublicMessages.findIndex(m => m.id === payload.new.id);
      if (idx !== -1) dbPublicMessages[idx] = { ...payload.new, isWhisper: false, isSystemMessage: payload.new.role === "system" };
      const hIdx = dbHistoricalMessages.findIndex(m => m.id === payload.new.id);
      if (hIdx !== -1) dbHistoricalMessages[hIdx] = { ...payload.new, isWhisper: false, isSystemMessage: payload.new.role === "system" };
      renderMessages();
    })
    .subscribe();

  await removeBackendChannel(pollsChannel);
  pollsChannel = backend.channel("chat-polls")
    .on("postgres_changes", { event: "*", schema: "public", table: "chat_polls", filter: "channel_id=eq." + activeChatChannelId }, payload => {
      if (payload.eventType === "DELETE") dbPublicMessages = dbPublicMessages.filter(item => !(item.isPoll && item.id === payload.old.id));
      else {
        const updated = normalizeChatPoll(payload.new);
        const index = dbPublicMessages.findIndex(item => item.isPoll && item.id === updated.id);
        if (index >= 0) dbPublicMessages[index] = updated; else dbPublicMessages.push(updated);
      }
      renderMessages();
    }).subscribe();

  await removeBackendChannel(privateChannel);
  privateChannel = null;
  privateChannel = backend
    .channel('public:whispers')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'whispers' }, payload => {
      const newWhisper = payload.new;
      if (newWhisper.participants && newWhisper.participants.includes(user.id)) {
        const incomingMessage = { ...newWhisper, isWhisper: true, isSystemMessage: newWhisper.isOmoggleInvite === true || newWhisper.type === 'vc_invite' || newWhisper.role === 'system' };
        maybeNotifyForMention(incomingMessage);
        dbPrivateMessages.push(incomingMessage);
        renderMessages(true);
      }
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'whispers' }, payload => {
      const updatedWhisper = payload.new;
      if (updatedWhisper.participants && updatedWhisper.participants.includes(user.id)) {
        const idx = dbPrivateMessages.findIndex(m => m.id === updatedWhisper.id);
        if (idx !== -1) {
          dbPrivateMessages[idx] = { ...updatedWhisper, isWhisper: true, isSystemMessage: updatedWhisper.isOmoggleInvite === true || updatedWhisper.type === 'vc_invite' || updatedWhisper.role === 'system' };

          if (updatedWhisper.isOmoggleInvite && updatedWhisper.inviteStatus === "accepted") {
            const sessionRedirectToken = `omoggle_redirected_${updatedWhisper.id}`;
            if (!processedOmoggleRedirects.has(updatedWhisper.id)) {
              processedOmoggleRedirects.add(updatedWhisper.id);
              sessionStorage.setItem(sessionRedirectToken, "true");

              const roleIdentityString = user.id === updatedWhisper.senderId ? "host" : "guest";
              setTimeout(() => {
                if (window.location.pathname.includes('/omoggle/')) return;
                window.location.href = `../omoggle/?room=${updatedWhisper.id}&role=${roleIdentityString}&hostName=${encodeURIComponent(updatedWhisper.username)}`;
              }, 800);
            }
          }
          renderMessages();
        }
      }
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'whispers' }, payload => {
      dbPrivateMessages = dbPrivateMessages.filter(m => m.id !== payload.old.id);
      renderMessages();
    })
    .subscribe();
}

async function jumpToMessage(collection, messageId) {
  if (!collection || messageId === null || messageId === undefined) return;
  const selector = (value) => {
    const escaped = window.CSS && CSS.escape ? CSS.escape(String(value)) : String(value).replace(/[^a-zA-Z0-9_-]/g, "\\$&");
    return `[data-message-collection="${collection}"][data-message-id="${escaped}"]`;
  };

  let target = document.querySelector(selector(messageId));
  if (!target) {
    try {
      const { data, error } = await backend.from(collection).select("id, text, username, userId, senderId, avatar, role, timestamp, type, room_id, participants, isOmoggleInvite, inviteStatus, reply_to_id, reply_to_collection, reply_to_username, reply_to_text, forward_of_id, forward_of_collection, forward_of_text, clientSideId").eq("id", messageId).maybeSingle();
      if (!error && data) {
        const normalized = {
          ...data,
          isWhisper: collection === "whispers",
          isSystemMessage: collection === "messages" ? data.role === "system" : (data.isOmoggleInvite === true || data.type === "vc_invite" || data.role === "system")
        };
        const list = collection === "messages" ? dbHistoricalMessages : dbPrivateMessages;
        if (!list.some(m => m.id === normalized.id)) list.push(normalized);
        renderMessages();
        target = document.querySelector(selector(messageId));
      }
    } catch (error) {
      console.warn("Could not load referenced message:", error);
    }
  }

  if (!target) {
    showLocalSystemMessage("That message could not be found.", true);
    return;
  }

  target.scrollIntoView({ behavior: "smooth", block: "center" });
  target.classList.remove("msg-jump-highlight");
  void target.offsetWidth;
  target.classList.add("msg-jump-highlight");
  setTimeout(() => target.classList.remove("msg-jump-highlight"), 1800);
}

function setReplyTarget(msgData, collection) {
  if (!msgData || msgData.id === undefined || msgData.id === null) return;
  if (replyingToMessage && replyingToMessage.id === msgData.id && replyingToMessage.collection === collection) {
    replyingToMessage = null;
    const input = document.getElementById("message-input");
    if (input) input.focus();
    return;
  }
  replyingToMessage = { id: msgData.id, collection, username: msgData.username || "User", text: msgData.text || "" };
  const input = document.getElementById("message-input");
  if (input) {
    input.placeholder = `Reply to @${replyingToMessage.username}...`;
    input.focus();
  }
}

async function forwardMessage(msgData, collection) {
  if (!msgData || msgData.id === undefined || msgData.id === null || !currentUser) return;
  if (msgData.isSystemMessage || msgData.isOmoggleInvite) {
    showLocalSystemMessage("This message cannot be forwarded.", true);
    return;
  }
  if (currentUserMutedUntil && Date.now() < currentUserMutedUntil) {
    startCooldownTimer(currentUserMutedUntil);
    return;
  }
  const isAdminPlus = currentUserRole === "admin" || currentUserRole === "owner";
  const now = Date.now();
  if (!isAdminPlus && now - lastMessageTime < MESSAGE_COOLDOWN) return;

  const clientSideId = "msg-" + Date.now() + Math.random().toString(36).substring(2);
  const base = {
    text: msgData.text || "",
    username: currentUsername,
    avatar: currentUsername ? currentUsername[0].toUpperCase() : "U",
    role: currentUserRole,
    clientSideId,
    forward_of_id: msgData.id,
    forward_of_collection: collection,
    forward_of_username: msgData.username || "User",
    forward_of_text: msgData.text || "",
    server_id: activeChatServerId,
    channel_id: activeChatChannelId
  };

  try {
    if (collection === "whispers") {
      const participants = Array.isArray(msgData.participants) && msgData.participants.length > 0 ? msgData.participants : [currentUser.id];
      const { error } = await backend.from("whispers").insert([{
        ...base, senderId: currentUser.id, participants, isWhisper: true, isSystemMessage: false
      }]);
      if (error) throw error;
    } else {
      const { error } = await backend.from("messages").insert([{ ...base, userId: currentUser.id }]);
      if (error) throw error;
    }
    lastMessageTime = now;
    if (!isAdminPlus) startCooldownTimer();
  } catch (error) {
    console.error("Failed to forward message:", error);
    showLocalSystemMessage(error.message || "Failed to forward message.", true);
  }
}

function renderMessages(forceScrollDown = false) {
  const scroller = document.getElementById("message-scroller");
  if (!hasAcceptedChatRules() || !currentUserGrade) {
    if (scroller) scroller.innerHTML = "";
    return;
  }
  if (currentUserBannedUntil && Date.now() < currentUserBannedUntil) {
    handleBannedUserDisplay();
    return;
  }
  if (!scroller) return;

  // Capture the reader's position before touching the DOM. Keep the same
  // visible message anchored when reading history; only follow new messages
  // when the reader was already at the bottom.
  const wasPinnedToBottom =
    scroller.scrollHeight - scroller.clientHeight <= scroller.scrollTop + 40;
  const anchor = !wasPinnedToBottom
    ? [...scroller.children].find(node => node.classList?.contains("msg-block") &&
        node.getBoundingClientRect().bottom > scroller.getBoundingClientRect().top)
    : null;
  const anchorKey = anchor?.dataset.renderKey || null;
  const anchorOffset = anchor
    ? anchor.getBoundingClientRect().top - scroller.getBoundingClientRect().top
    : 0;

  updateAutocompleteCacheFromLoadedMessages();

  const regularMessages = [...dbHistoricalMessages, ...dbPublicMessages, ...dbPrivateMessages];
  const hasRegularMessages = regularMessages.some(msg => !msg.isSystemMessage) ||
    localPendingQueue.some(msg => !msg.isSystemMessage);
  const canSeeLocalSystemMessages = currentUserRole === "admin" || currentUserRole === "owner";
  const visibleEphemeralMessages =
    (hasRegularMessages && !canSeeLocalSystemMessages) ? [] : ephemeralSystemMessages;
  let allMessages = [...visibleEphemeralMessages, ...regularMessages];

  if (currentUserRole !== "admin" && currentUserRole !== "owner") {
    allMessages = allMessages.filter(msg => msg.type !== "mod_log");
  }

  const seenIds = new Set();
  allMessages = allMessages.filter(msg => {
    const msgId = msg.id || msg.clientSideId;
    if (!msgId) return true;
    const uniqueKey = `${msg.isWhisper ? "whispers" : "messages"}:${msgId}`;
    if (seenIds.has(uniqueKey)) return false;
    seenIds.add(uniqueKey);
    return true;
  });

  allMessages.sort((a, b) => {
    const timeA = a.timestamp ? new Date(a.timestamp).getTime() : Date.now();
    const timeB = b.timestamp ? new Date(b.timestamp).getTime() : Date.now();
    return timeA - timeB;
  });

  const confirmedDbClientIds = new Set(allMessages.map(m => m.clientSideId).filter(Boolean));
  localPendingQueue = localPendingQueue.filter(m => !confirmedDbClientIds.has(m.clientSideId));

  const desiredMessages = [...allMessages, ...localPendingQueue];
  const desiredKeys = desiredMessages.map(msg => {
    const collection = msg.isWhisper ? "whispers" : "messages";
    const id = msg.id ?? msg.clientSideId;
    return id != null ? `${collection}:${id}` : null;
  });

  // Reuse existing message elements instead of clearing/rebuilding the whole
  // scroller. This prevents videos/audio from being recreated on every event.
  const existingByKey = new Map();
  [...scroller.querySelectorAll(":scope > .msg-block[data-render-key]")].forEach(node => {
    existingByKey.set(node.dataset.renderKey, node);
  });

  const desiredNodes = [];
  if (allMessagesLoaded) {
    let banner = scroller.querySelector(":scope > [data-render-key='history-loaded-banner']");
    if (!banner) {
      banner = document.createElement("div");
      banner.dataset.renderKey = "history-loaded-banner";
      banner.style.cssText = "text-align: center; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; padding: 10px 0; width: 100%; margin-bottom: 0.5rem;";
      banner.textContent = "All messages loaded";
    }
    desiredNodes.push(banner);
  }

  desiredMessages.forEach((msg, index) => {
    const key = desiredKeys[index] || `fallback:${index}`;
    let node = existingByKey.get(key);
    const signature = JSON.stringify(msg);
    if (!node || node.dataset.renderSignature !== signature) {
      const holder = document.createElement("div");
      displayMessage(holder, msg);
      const replacementNode = holder.firstElementChild;
      if (!replacementNode) return;
      replacementNode.dataset.renderKey = key;
      replacementNode.dataset.renderSignature = signature;
      if (node) node.replaceWith(replacementNode);
      node = replacementNode;
    } else {
      existingByKey.delete(key);
    }
    desiredNodes.push(node);
  });

  const keep = new Set(desiredNodes);
  [...scroller.children].forEach(node => {
    if (!keep.has(node)) node.remove();
  });

  // Only move nodes when their order actually differs. Appending a new message
  // therefore leaves all existing media elements mounted and playing.
  let cursor = scroller.firstElementChild;
  desiredNodes.forEach(node => {
    if (node !== cursor) scroller.insertBefore(node, cursor);
    cursor = node.nextElementSibling;
  });

  if (wasPinnedToBottom || forceScrollDown && wasPinnedToBottom) {
    scroller.scrollTop = scroller.scrollHeight;
  } else if (anchorKey) {
    const restoredAnchor = scroller.querySelector(`.msg-block[data-render-key="${CSS.escape(anchorKey)}"]`);
    if (restoredAnchor) {
      const newOffset = restoredAnchor.getBoundingClientRect().top - scroller.getBoundingClientRect().top;
      scroller.scrollTop += newOffset - anchorOffset;
    }
  }
}

function normalizeChatPoll(poll) {
  return { ...poll, isPoll: true, isWhisper: false, isSystemMessage: false, username: poll.created_by_name || "Admin", timestamp: poll.created_at ? new Date(poll.created_at).getTime() : Date.now() };
}

  const time = msgData.timestamp ? new Date(msgData.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "Sending...";
  if (msgData.isPoll) {
    const options = Array.isArray(msgData.options) ? msgData.options : [];
    const votes = msgData.votes && typeof msgData.votes === "object" ? msgData.votes : {};
    const expired = !msgData.expires_at || new Date(msgData.expires_at).getTime() <= Date.now();
    const total = options.reduce((sum, _, i) => sum + (Array.isArray(votes[String(i)]) ? votes[String(i)].length : 0), 0);

        "<span style=\"display:flex;justify-content:space-between;gap:8px;\"><span>" + (msgData.poll_mode === "sc" ? (selected ? "◉" : "◯") : (selected ? "☑" : "□")) + " &nbsp;" + escapeHtml(option) + "</span><strong>" + count + " · " + pct + "%</strong></span>" +
        "<span style=\"display:block;height:5px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:8px;\"><span style=\"display:block;height:100%;width:" + pct + "%;background:var(--accent);\"></span></span></button>";

        if (record) {

        console.error("Failed to process document purge lifecycle steps:", err);
      }
    };
  }
