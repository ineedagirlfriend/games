function attachStreamToVideo(peerId, stream, isLocal = false) {
  const grid = document.getElementById('vc-participant-grid');
  if (!grid) return;
  
  const tile = grid.querySelector(`[data-peer-id="${peerId}"]`);
  if (!tile) return;
  
  const videoEl = tile.querySelector('video');
  if (videoEl && stream) {
    videoEl.srcObject = stream;
    videoEl.muted = isLocal;
    videoEl.play().catch(error => {
      if (error.name !== 'NotAllowedError') console.warn('Video play error:', error);
    });
  }
}

function updateGridParticipantLayout(participantsArray) {
  const grid = document.getElementById('vc-participant-grid');
  const countDisplay = document.getElementById('vc-participant-count');
  
  if (!grid || !countDisplay) return;

  const count = participantsArray.length;
  countDisplay.textContent = `${count} participant${count !== 1 ? 's' : ''}`;

  grid.className = '';
  
  if (count === 1) grid.classList.add('count-1');
  else if (count === 2) grid.classList.add('count-2');
  else if (count === 3) grid.classList.add('count-3');
  else if (count === 4) grid.classList.add('count-4');
  else if (count >= 5) grid.classList.add('count-5plus');

  grid.innerHTML = '';

  const sortedParticipants = [...participantsArray].sort((a, b) => {
    if (a.isScreenSharing && !b.isScreenSharing) return -1;
    if (!a.isScreenSharing && b.isScreenSharing) return 1;
    if (a.isSpeaking && !b.isSpeaking) return -1;
    if (!a.isSpeaking && b.isSpeaking) return 1;
    return 0;
  });

  sortedParticipants.forEach((participant) => {
    const tile = document.createElement('div');
    tile.className = 'vc-tile';
    tile.dataset.peerId = participant.peerId;

    if (participant.isScreenSharing || participant.isSpeaking) {
      tile.classList.add('focus-tile');
    }

    if (participant.isSpeaking) {
      tile.classList.add('is-speaking');
    }

    const videoEl = document.createElement('video');
    videoEl.autoplay = true;
    videoEl.playsInline = true;
    videoEl.setAttribute('playsinline', ''); 
    videoEl.setAttribute('webkit-playsinline', '');
    videoEl.muted = participant.peerId === vcPeer?.id || participant.userId === currentUser?.id;
    
    if (!participant.isCameraOn && !participant.isScreenSharing) {
      videoEl.classList.add('is-hidden');
    }

    const avatarEl = document.createElement('div');
    avatarEl.className = 'vc-avatar-img';
    if (participant.isCameraOn || participant.isScreenSharing) {
      avatarEl.classList.add('is-hidden');
    }
    avatarEl.textContent = (participant.username || 'U').charAt(0).toUpperCase();

    const overlayEl = document.createElement('div');
    overlayEl.className = 'vc-tile-overlay';

    const infoEl = document.createElement('div');
    infoEl.className = 'vc-tile-info';

    const usernameEl = document.createElement('div');
    usernameEl.className = 'vc-username';
    usernameEl.textContent = participant.username || 'User';
    infoEl.appendChild(usernameEl);

    if (participant.isMuted) {
      const micBadge = document.createElement('div');
      micBadge.className = 'vc-status-badge';
      const micImg = document.createElement('img');
      micImg.src = '../assets/chat-vc-mic-muted.svg';
      micImg.alt = 'Muted';
      micBadge.appendChild(micImg);
      infoEl.appendChild(micBadge);
    }

    if (!participant.isCameraOn && !participant.isScreenSharing) {
      const camBadge = document.createElement('div');
      camBadge.className = 'vc-status-badge';
      const camImg = document.createElement('img');
      camImg.src = '../assets/chat-vc-camera-disabled.svg';
      camImg.alt = 'Camera off';
      camBadge.appendChild(camImg);
      infoEl.appendChild(camBadge);
    }

    if (participant.isScreenSharing) {
      const screenBadge = document.createElement('div');
      screenBadge.className = 'vc-status-badge';
      const screenImg = document.createElement('img');
      screenImg.src = '../assets/chat-vc-screenshare.svg';
      screenImg.alt = 'Screen sharing';
      screenBadge.appendChild(screenImg);
      infoEl.appendChild(screenBadge);
    }

    overlayEl.appendChild(infoEl);

    if (participant.peerId === vcPeer?.id || participant.userId === currentUser?.id && participant.peerId === vcPeer?.id) {
      const localBadge = document.createElement('div');
      localBadge.className = 'vc-local-badge';
      localBadge.textContent = 'You';
      overlayEl.appendChild(localBadge);
    }

    tile.appendChild(videoEl);
    tile.appendChild(avatarEl);
    tile.appendChild(overlayEl);

    grid.appendChild(tile);

    const stream = participant.peerId === vcPeer?.id ? vcLocalStream : vcRemoteStreams.get(participant.peerId);
    if (stream) {
      videoEl.srcObject = stream;
      videoEl.play().catch(error => {
        if (error.name !== 'NotAllowedError') console.warn('Video play error:', error);
      });
    }
  });
}

function setParticipantMediaState(peerId, state) {
  const participant = vcParticipants.get(peerId);
  if (!participant) return;

  Object.assign(participant, state);
  vcParticipants.set(peerId, participant);

  updateGridParticipantLayout(Array.from(vcParticipants.values()));

  if (peerId === vcPeer?.id) {
    Object.assign(vcLocalState, state);

    const micBtn = document.getElementById('vc-mic-btn');
    const camBtn = document.getElementById('vc-camera-btn');

    if (micBtn) {
      const micImg = micBtn.querySelector('img');
      if (micImg) {
        micImg.src = vcLocalState.isMuted 
          ? '../assets/chat-vc-mic-muted.svg' 
          : '../assets/chat-vc-mic-unmuted.svg';
      }
    }

    if (camBtn) {
      const camImg = camBtn.querySelector('img');
      if (camImg) {
        camImg.src = vcLocalState.isCameraOn 
          ? '../assets/chat-vc-camera-enabled.svg' 
          : '../assets/chat-vc-camera-disabled.svg';
      }
    }
  }
}

async function joinVoiceRoom(roomId) {
  if (!roomId || vcActiveRoomId || vcPeer || vcLocalStream) return;
  vcActiveRoomId = roomId;
  const dock = document.getElementById('vc-dock-container');
  if (dock) {
    dock.style.display = 'flex';
    dock.style.flexDirection = 'column';
  }

  if (!currentUser) {
    vcActiveRoomId = null;
    return;
  }

  if (!navigator.mediaDevices?.getUserMedia) {
    showLocalSystemMessage('Voice chat is not supported by this browser.', true);
    vcActiveRoomId = null;
    return;
  }

  try {
    vcLocalStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  } catch (err) {
    console.error('Failed to get media:', err);
    showLocalSystemMessage('Could not access camera/microphone. Please check permissions.', true);
    vcActiveRoomId = null;
    return;
  }

  const peerSuffix = (window.crypto && typeof window.crypto.randomUUID === 'function')
    ? window.crypto.randomUUID()
    : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const myPeerId = `${currentUser.id}-${peerSuffix}`;
  
  if (typeof Peer === 'undefined') {
    console.error('PeerJS library not loaded');
    showLocalSystemMessage('Voice chat system failed to initialize.', true);
    vcLocalStream.getTracks().forEach(track => track.stop());
    vcLocalStream = null;
    vcActiveRoomId = null;
    return;
  }

  vcPeer = new Peer(myPeerId);
  vcPeerId = myPeerId;

  vcPeer.on('open', (id) => {
    console.log('PeerJS connected with ID:', id);
    broadcastVCPresence(roomId, id);
  });

  vcPeer.on('call', (call) => {
    console.log('Incoming call from:', call.peer);
    if (vcCalls.has(call.peer)) {
      try { call.close(); } catch (error) { console.warn('Failed to close duplicate voice call:', error); }
      return;
    }
    vcCalls.set(call.peer, call);
    if (!vcLocalStream) {
      try { call.close(); } catch (error) { console.warn('Failed to close call without local media:', error); }
      vcCalls.delete(call.peer);
      return;
    }
    try {
      call.answer(vcLocalStream);
      handleIncomingCall(call);
    } catch (error) {
      console.error('Failed to answer voice call:', error);
      vcCalls.delete(call.peer);
      try { call.close(); } catch (closeError) { console.warn('Failed to close voice call:', closeError); }
    }
  });

  vcPeer.on('error', (err) => {
    console.error('PeerJS error:', err);
    if (err.type === 'peer-unavailable') {
      console.warn('Peer unavailable:', err);
      const unavailablePeerId = err.message?.match(/ID "(.+)"/)?.[1];
      if (unavailablePeerId) removeVCPeer(unavailablePeerId);
    } else if (err.type === 'network' || err.type === 'socket-error' || err.type === 'socket-closed') {
      clearVCPeerConnectionsForReconnect();
    }
  });

  vcPeer.on('disconnected', () => {
    console.log('PeerJS disconnected');
    clearVCPeerConnectionsForReconnect();
    if (vcActiveRoomId && vcPeer && !vcPeer.destroyed) vcPeer.reconnect();
  });

  subscribeToVCChannel(roomId);

  const localParticipant = {
    peerId: myPeerId,
    userId: currentUser.id,
    username: currentUsername,
    isMuted: vcLocalState.isMuted,
    isCameraOn: true,
    isScreenSharing: false,
    isSpeaking: false
  };
  vcParticipants.set(myPeerId, localParticipant);
  vcPeerLastSeen.set(myPeerId, Date.now());
  updateGridParticipantLayout(Array.from(vcParticipants.values()));
}

function clearVCPeerConnectionsForReconnect() {
  vcCalls.forEach(call => {
    try { call.close(); } catch (error) { console.warn('Failed to close stale voice call:', error); }
  });
  vcCalls.clear();

  vcRemoteStreams.forEach(stream => stream.getTracks().forEach(track => track.stop()));
  vcRemoteStreams.clear();

  const localPeerId = vcPeer?.id;
  vcParticipants = new Map([...vcParticipants].filter(([peerId]) => peerId === localPeerId));
  vcPeerLastSeen = new Map([...vcPeerLastSeen].filter(([peerId]) => peerId === localPeerId));
  updateGridParticipantLayout(Array.from(vcParticipants.values()));
}

function startVCPresenceHeartbeat(roomId, peerId) {
  if (vcHeartbeatInterval) clearInterval(vcHeartbeatInterval);

  vcHeartbeatInterval = setInterval(() => {
    const now = Date.now();
    vcPeerLastSeen.forEach((lastSeen, remotePeerId) => {
      if (remotePeerId !== peerId && now - lastSeen > VC_PEER_TIMEOUT_MS) {
        removeVCPeer(remotePeerId);
      }
    });

    if (vcRealtimeChannel && vcActiveRoomId === roomId) {
      vcRealtimeChannel.send({
        type: 'broadcast',
        event: 'vc-heartbeat',
        payload: {
          peerId,
          userId: currentUser?.id,
          timestamp: now
        }
      });
    }
  }, VC_HEARTBEAT_INTERVAL_MS);
}

function broadcastVCPresence(roomId, peerId) {
  const generation = ++vcPresenceGeneration;
  vcChannelTransition = vcChannelTransition.then(async () => {
    if (generation !== vcPresenceGeneration || !vcActiveRoomId) return;

    await removeBackendChannel(vcRealtimeChannel);
    vcRealtimeChannel = null;

    const channel = backend.channel(`vc_room_${roomId}`, {
      config: { broadcast: { self: false } }
    });
    vcRealtimeChannel = channel;

    channel
      .on('broadcast', { event: 'vc-join' }, ({ payload }) => {
        handleVCJoinEvent(payload);
      })
      .on('broadcast', { event: 'vc-leave' }, ({ payload }) => {
        handleVCLeaveEvent(payload);
      })
      .on('broadcast', { event: 'vc-state' }, ({ payload }) => {
        handleVCStateEvent(payload);
      })
      .on('broadcast', { event: 'vc-heartbeat' }, ({ payload }) => {
        handleVCHeartbeatEvent(payload);
      })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED' && generation === vcPresenceGeneration && vcRealtimeChannel === channel) {
          channel.send({
            type: 'broadcast',
            event: 'vc-join',
            payload: {
              peerId: peerId,
              userId: currentUser.id,
              username: currentUsername,
              timestamp: Date.now()
            }
          });
          startVCPresenceHeartbeat(roomId, peerId);
        }
      });
  }).catch(error => {
    console.error('Failed to restore VC presence:', error);
  });

  return vcChannelTransition;
}

function handleVCJoinEvent(payload) {
  const { peerId, username, userId } = payload;
  
  if (!peerId || peerId === vcPeer?.id) return;

  vcPeerLastSeen.set(peerId, Date.now());

  if (!vcParticipants.has(peerId)) {
    vcParticipants.set(peerId, {
      peerId: peerId,
      userId: userId || null,
      username: username || 'User',
      isMuted: false,
      isCameraOn: true,
      isScreenSharing: false,
      isSpeaking: false
    });
    updateGridParticipantLayout(Array.from(vcParticipants.values()));
  }

  const remoteUserId = userId || peerId;
  const localPeerId = vcPeer?.id || '';
  if (currentUser?.id < remoteUserId || (currentUser?.id === remoteUserId && localPeerId < peerId)) {
    callPeer(peerId);
  }
}

function handleVCHeartbeatEvent(payload) {
  const { peerId } = payload || {};
  if (!peerId || peerId === vcPeer?.id) return;
  vcPeerLastSeen.set(peerId, Date.now());
}

function handleVCLeaveEvent(payload) {
  const { peerId } = payload;
  if (!peerId || peerId === vcPeer?.id) return;
  removeVCPeer(peerId);
}

function removeVCPeer(peerId) {
  const remoteStream = vcRemoteStreams.get(peerId);
  if (remoteStream) {
    remoteStream.getTracks().forEach(track => track.stop());
    vcRemoteStreams.delete(peerId);
  }

  const call = vcCalls.get(peerId);
  if (call) {
    try { call.close(); } catch (error) { console.warn('Failed to close voice call:', error); }
    vcCalls.delete(peerId);
  }

  vcParticipants.delete(peerId);
  vcPeerLastSeen.delete(peerId);
  updateGridParticipantLayout(Array.from(vcParticipants.values()));
}

function handleVCStateEvent(payload) {
  const { peerId, state } = payload;
  if (!peerId || peerId === vcPeer?.id) return;

  const participant = vcParticipants.get(peerId);
  if (participant) {
    Object.assign(participant, state);
    vcParticipants.set(peerId, participant);
    updateGridParticipantLayout(Array.from(vcParticipants.values()));
  }
}

function callPeer(peerId) {
  if (!vcPeer || !vcLocalStream) return;
  if (vcCalls.has(peerId)) return;

  console.log('Calling peer:', peerId);
  let call;
  try {
    call = vcPeer.call(peerId, vcLocalStream);
  } catch (error) {
    console.error('Failed to call peer:', error);
    return;
  }
  
  if (!call) return;

  vcCalls.set(peerId, call);
  handleIncomingCall(call);
}

function handleIncomingCall(call) {
  if (!call || !call.peer || call.peer === vcPeer?.id) return;
  const existingCall = vcCalls.get(call.peer);
  if (existingCall && existingCall !== call) {
    try { call.close(); } catch (error) { console.warn('Failed to close duplicate voice call:', error); }
    return;
  }

  vcCalls.set(call.peer, call);
  call.on('stream', (remoteStream) => {
    console.log('Received stream from:', call.peer);
    vcRemoteStreams.set(call.peer, remoteStream);

    if (!vcParticipants.has(call.peer)) {
      vcParticipants.set(call.peer, {
        peerId: call.peer,
        userId: null,
        username: 'User',
        isMuted: false,
        isCameraOn: true,
        isScreenSharing: false,
        isSpeaking: false
      });
    }

    updateGridParticipantLayout(Array.from(vcParticipants.values()));
  });

  call.on('close', () => {
    console.log('Call closed with:', call.peer);
    if (vcCalls.get(call.peer) === call) vcCalls.delete(call.peer);
    const remoteStream = vcRemoteStreams.get(call.peer);
    if (remoteStream) {
      remoteStream.getTracks().forEach(track => track.stop());
      vcRemoteStreams.delete(call.peer);
    }
    if (vcParticipants.has(call.peer)) {
      vcParticipants.delete(call.peer);
      updateGridParticipantLayout(Array.from(vcParticipants.values()));
    }
  });

  call.on('error', (err) => {
    console.error('Call error:', err);
    removeVCPeer(call.peer);
  });
}

function subscribeToVCChannel(roomId) {
  if (!roomId || !vcPeer?.id || !vcActiveRoomId) return Promise.resolve();
  return broadcastVCPresence(roomId, vcPeer.id);
}

async function leaveVoiceRoom({ cleanupRoom = true } = {}) {
  vcPresenceGeneration += 1;
  if (vcHeartbeatInterval) {
    clearInterval(vcHeartbeatInterval);
    vcHeartbeatInterval = null;
  }

  if (vcRealtimeChannel) {
    const channel = vcRealtimeChannel;
    vcRealtimeChannel = null;
    channel.send({
      type: 'broadcast',
      event: 'vc-leave',
      payload: {
        peerId: vcPeer?.id || currentUser?.id,
        timestamp: Date.now()
      }
    }).catch(error => console.warn('Failed to broadcast voice leave:', error));
    await removeBackendChannel(channel);
  }

  if (cleanupRoom && vcActiveRoomId && vcParticipants.size <= 1) {
    try {
      await backend.from("vc_rooms").delete().eq("room_id", vcActiveRoomId);
      await backend.from("messages").update({ text: "This call has ended." }).eq("room_id", vcActiveRoomId);
      await backend.from("whispers").update({ text: "This call has ended." }).eq("room_id", vcActiveRoomId);
    } catch (e) {
      console.error("Failed to cleanup VC room", e);
    }
  }

  if (vcScreenStream) {
    vcScreenStream.getTracks().forEach(track => track.stop());
    vcScreenStream = null;
  }

  if (vcLocalStream) {
    vcLocalStream.getTracks().forEach(track => track.stop());
    vcLocalStream = null;
  }

  vcRemoteStreams.forEach((stream) => {
    stream.getTracks().forEach(track => track.stop());
  });
  vcRemoteStreams.clear();
  vcPeerLastSeen.clear();

  vcCalls.forEach((call) => {
    call.close();
  });
  vcCalls.clear();

  if (vcPeer) {
    try { vcPeer.destroy(); } catch (error) { console.warn('Failed to destroy PeerJS instance:', error); }
    vcPeer = null;
  }
  vcPeerId = null;

  vcParticipants.clear();
  vcActiveRoomId = null;

  vcLocalState = {
    isMuted: false,
    isCameraOn: true,
    isScreenSharing: false,
    isSpeaking: false,
    currentFacingMode: 'user'
  };

  const dock = document.getElementById('vc-dock-container');
  if (dock) {
    dock.style.display = 'none';
  }

  const grid = document.getElementById('vc-participant-grid');
  if (grid) {
    grid.innerHTML = '';
  }

  const micBtn = document.getElementById('vc-mic-btn');
  const camBtn = document.getElementById('vc-camera-btn');
  if (micBtn) {
    const micImg = micBtn.querySelector('img');
    if (micImg) micImg.src = '../assets/chat-vc-mic-unmuted.svg';
  }
  if (camBtn) {
    const camImg = camBtn.querySelector('img');
    if (camImg) camImg.src = '../assets/chat-vc-camera-disabled.svg';
  }
}

async function toggleMic() {
  if (!vcLocalStream) return;
  const audioTrack = vcLocalStream.getAudioTracks()[0];
  if (!audioTrack) return;

  audioTrack.enabled = !audioTrack.enabled;
  const newMutedState = !audioTrack.enabled;

  setParticipantMediaState(vcPeer?.id || currentUser.id, { isMuted: newMutedState });

  if (vcRealtimeChannel) {
    vcRealtimeChannel.send({
      type: 'broadcast',
      event: 'vc-state',
      payload: {
        peerId: vcPeer?.id || currentUser.id,
        state: { isMuted: newMutedState }
      }
    });
  }
}

async function toggleCamera() {
  if (!vcLocalStream) return;
  const videoTrack = vcLocalStream.getVideoTracks()[0];
  if (!videoTrack) return;

  videoTrack.enabled = !videoTrack.enabled;
  const newCameraState = videoTrack.enabled;

  setParticipantMediaState(vcPeer?.id || currentUser.id, { isCameraOn: newCameraState });

  if (vcRealtimeChannel) {
    vcRealtimeChannel.send({
      type: 'broadcast',
      event: 'vc-state',
      payload: {
        peerId: vcPeer?.id || currentUser.id,
        state: { isCameraOn: newCameraState }
      }
    });
  }
}

async function flipCamera() {
  if (!vcLocalStream) return;
  const videoTrack = vcLocalStream.getVideoTracks()[0];
  if (!videoTrack) return;

  const currentFacingMode = vcLocalState.currentFacingMode || 'user';
  const newFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';

  try {
    const newStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: newFacingMode } },
      audio: false
    });
    
    vcLocalState.currentFacingMode = newFacingMode;
    const newVideoTrack = newStream.getVideoTracks()[0];
    
    vcCalls.forEach((call) => {
      if (call.peerConnection) {
        const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender) {
          sender.replaceTrack(newVideoTrack).catch(e => console.error('Replace track error:', e));
        }
      }
    });

    videoTrack.stop();
    vcLocalStream.removeTrack(videoTrack);
    vcLocalStream.addTrack(newVideoTrack);
    
    const localTile = document.querySelector(`[data-peer-id="${vcPeer?.id || currentUser.id}"] video`);
    if (localTile) localTile.srcObject = vcLocalStream;

  } catch (err) {
    console.error('Flip camera failed:', err);
    showLocalSystemMessage('Could not flip camera. Make sure both cameras are available.', true);
  }
}

async function toggleScreenShare() {
  if (!currentUser) return;

  if (isIOS) {
    showLocalSystemMessage("Screen sharing is not supported on iPad/iOS devices due to browser limitations.", true);
    return;
  }

  if (vcLocalState.isScreenSharing) {
    if (vcScreenStream) {
      vcScreenStream.getTracks().forEach(t => t.stop());
      vcScreenStream = null;
    }

    const cameraTrack = vcLocalStream?.getVideoTracks()[0];
    if (cameraTrack) {
      cameraTrack.enabled = true;

      vcCalls.forEach((call) => {
        if (call.peerConnection) {
          const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
          if (sender) {
            sender.replaceTrack(cameraTrack).catch(e => console.error('Replace track error:', e));
          }
        }
      });
    }

    setParticipantMediaState(vcPeer?.id || currentUser.id, { isScreenSharing: false, isCameraOn: true });

    if (vcRealtimeChannel) {
      vcRealtimeChannel.send({
        type: 'broadcast',
        event: 'vc-state',
        payload: {
          peerId: vcPeer?.id || currentUser.id,
          state: { isScreenSharing: false, isCameraOn: true }
        }
      });
    }
  } else {
    try {
      vcScreenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      const screenTrack = vcScreenStream.getVideoTracks()[0];

      const cameraTrack = vcLocalStream?.getVideoTracks()[0];
      if (cameraTrack) {
        cameraTrack.enabled = false;
      }

      vcCalls.forEach((call) => {
        if (call.peerConnection) {
          const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
          if (sender) {
            sender.replaceTrack(screenTrack).catch(e => console.error('Replace track error:', e));
          }
        }
      });

      screenTrack.onended = () => {
        if (vcLocalState.isScreenSharing) {
          toggleScreenShare();
        }
      };

      setParticipantMediaState(vcPeer?.id || currentUser.id, { isScreenSharing: true, isCameraOn: false });

      if (vcRealtimeChannel) {
        vcRealtimeChannel.send({
          type: 'broadcast',
          event: 'vc-state',
          payload: {
            peerId: vcPeer?.id || currentUser.id,
            state: { isScreenSharing: true, isCameraOn: false }
          }
        });
      }
    } catch (err) {
      console.error('Screenshare failed:', err);
      if (err.name !== 'AbortError') {
        showLocalSystemMessage('Screen sharing failed: ' + err.message, true);
      }
    }
  }
}
