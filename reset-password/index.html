<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Carson Games</title>
  <script src="../assets/theme-loader.js"></script>
  <link rel="stylesheet" href="../style.css">
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at top,rgba(108,99,255,.12),transparent 45%),var(--bg); color:var(--text); font-family:var(--font); }
    .auth-shell { width:min(520px,calc(100vw - 2rem)); padding:2rem; background:var(--card); border:1px solid var(--border); border-radius:24px; box-shadow:0 30px 90px rgba(0,0,0,.35); }
    h1 { margin:0 0 .75rem; font-family:var(--font-display); font-size:2rem; letter-spacing:-.04em; }
    p { color:var(--text-muted); line-height:1.6; }
    form { display:grid; gap:1rem; margin-top:1.5rem; }
    .input-group { display:grid; gap:.45rem; }
    label { font-size:.85rem; color:var(--text-muted); }
    input { width:100%; box-sizing:border-box; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:14px 16px; border-radius:14px; font:inherit; }
    input:focus { border-color:var(--accent); outline:none; box-shadow:0 0 0 3px rgba(108,99,255,.12); }
    button { border:0; border-radius:999px; padding:13px 18px; cursor:pointer; font:inherit; }
    .btn-primary { background:var(--accent); color:white; font-weight:700; }
    .status { min-height:1.4em; font-size:.92rem; overflow-wrap:anywhere; }
    a { color:var(--text-muted); text-decoration:none; }
    a:hover { color:var(--accent); text-decoration:underline; }
    .hidden { display:none !important; }
  </style>
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
</head>
<body>
  <main class="auth-shell">
    <h1 id="page-title">Reset your password</h1>
    <p id="page-description">Enter the email address connected to your Carson Games account. We'll send you a password-reset link.</p>

    <form id="request-form">
      <div class="input-group">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <button class="btn-primary" type="submit" id="request-button">Send reset link</button>
      <div class="status" id="request-status" role="status" aria-live="polite"></div>
    </form>

    <form id="update-form" class="hidden">
      <div class="input-group">
        <label for="new-password">New password</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
      </div>
      <div class="input-group">
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" placeholder="Enter it again" required>
      </div>
      <button class="btn-primary" type="submit" id="update-button">Save new password</button>
      <div class="status" id="update-status" role="status" aria-live="polite"></div>
    </form>

    <p><a href="../login/">← Back to sign in</a></p>
  </main>

  <script type="module">
    import { createClient } from "../assets/backend-client.js?v=20261115-2";
    const backend = createClient();

    const requestForm = document.getElementById("request-form");
    const updateForm = document.getElementById("update-form");
    const title = document.getElementById("page-title");
    const description = document.getElementById("page-description");
    const requestStatus = document.getElementById("request-status");
    const updateStatus = document.getElementById("update-status");
    const requestButton = document.getElementById("request-button");
    const updateButton = document.getElementById("update-button");

    function showPasswordForm() {
      requestForm.classList.add("hidden");
      updateForm.classList.remove("hidden");
      title.textContent = "Choose a new password";
      description.textContent = "Enter and confirm your new Carson Games password.";
    }

    backend.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) showPasswordForm();
    });

    requestForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();
      requestButton.disabled = true;
      requestStatus.textContent = "Sending reset link…";
      try {
        const redirectTo = new URL("../reset-password/", window.location.href).href;
        const { error } = await backend.auth.resetPasswordForEmail(email, { redirectTo });
        if (error) throw error;
        requestStatus.textContent = "If an account uses that email, a password-reset link has been sent. Check your inbox and spam folder.";
      } catch (error) {
        requestStatus.textContent = error.message || "Could not send the reset email. Please try again.";
        requestButton.disabled = false;
      }
    });

    updateForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const newPassword = document.getElementById("new-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
      if (newPassword.length < 8) {
        updateStatus.textContent = "Your password must be at least 8 characters.";
        return;
      }
      if (newPassword !== confirmPassword) {
        updateStatus.textContent = "The passwords do not match.";
        return;
      }
      updateButton.disabled = true;
      updateStatus.textContent = "Updating password…";
      try {
        const { error } = await backend.auth.updateUser({ password: newPassword });
        if (error) throw error;
        updateStatus.textContent = "Password updated! You can now sign in with your new password.";
        updateForm.reset();
        await backend.auth.signOut();
        const back = document.createElement("a");
        back.href = "../login/";
        back.textContent = " Go to sign in";
        updateStatus.appendChild(back);
      } catch (error) {
        updateStatus.textContent = error.message || "Could not update your password. Request a new reset link and try again.";
        updateButton.disabled = false;
      }
    });

    // A recovery link should open this page with a recovery session. If it doesn't,
    // keep the email-request form visible and let the user request another link.
  </script>
</body>
</html>
