<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Live | NAGames</title>
  <script src="../assets/theme-loader.js"></script>
  <link rel="stylesheet" href="../style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
  <style>
    body { min-height:100vh; }
    .stream-page { width:min(1500px,100%); margin:0 auto; padding:28px 24px 50px; flex:1; }
    .stream-heading { display:flex;align-items:center;justify-content:space-between;gap:16px;margin:10px 0 22px; }
    .stream-heading h1 { font:800 2rem/1.2 var(--font-display);letter-spacing:-.03em;color:var(--text); }
    .stream-heading p { color:var(--text-muted);margin-top:7px;font-size:.92rem; }
    .live-layout { display:grid;grid-template-columns:minmax(0,1.65fr) minmax(310px,.9fr);gap:20px;align-items:stretch;min-height:660px; }
    .stream-column,.stream-chat-panel { min-width:0;background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.18); }
    .video-shell { position:relative;width:100%;aspect-ratio:16/9;background:#020308;display:grid;place-items:center;overflow:hidden; }
    #stream-video { width:100%;height:100%;object-fit:contain;background:#020308; }
    .video-empty { position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#94a3b8;gap:12px; }
    .video-empty-icon { width:66px;height:66px;border-radius:20px;background:#101321;border:1px solid #24283b;display:grid;place-items:center;font-size:27px;color:#a5b4fc; }
    .video-empty strong { color:#e2e8f0;font:800 1.15rem var(--font-display); }
    .live-indicator { position:absolute;top:14px;left:14px;display:none;align-items:center;gap:7px;padding:6px 10px;border-radius:7px;background:rgba(220,38,38,.92);color:white;font-size:.72rem;font-weight:900;letter-spacing:.06em; }
    .live-indicator.active { display:flex; }
    .live-dot { width:7px;height:7px;border-radius:50%;background:white;box-shadow:0 0 10px white; }
    .viewer-counter { position:absolute;top:14px;right:14px;padding:7px 10px;border-radius:8px;background:rgba(8,10,18,.8);color:#e2e8f0;font-size:.78rem;font-weight:800;backdrop-filter:blur(10px); }
    .stream-details { padding:20px 22px 18px; }
    .stream-title { font:800 clamp(1.2rem,2.2vw,1.65rem)/1.25 var(--font-display);color:var(--text);overflow-wrap:anywhere; }
    .streamer-row { display:flex;align-items:center;gap:12px;margin-top:15px; }
    .streamer-avatar { width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:0 0 44px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;font:900 1rem var(--font-display);overflow:hidden; }
    .streamer-name { font-weight:800;color:var(--text); }
    .streamer-subtitle { color:var(--text-muted);font-size:.78rem;margin-top:3px; }
    .streamer-role { display:inline-flex;margin-left:7px;padding:3px 7px;border-radius:5px;background:rgba(56,189,248,.14);border:1px solid rgba(56,189,248,.28);color:#7dd3fc;font-size:.62rem;font-weight:900;vertical-align:middle; }
    .profile-tags { display:flex;flex-wrap:wrap;gap:5px;margin-top:7px; }
    .profile-tag { padding:3px 7px;border-radius:5px;background:rgba(148,163,184,.12);color:#cbd5e1;font-size:.65rem;font-weight:800; }
    .stream-controls { padding:0 22px 22px;display:flex;flex-wrap:wrap;gap:10px; }
    .stream-controls button { min-height:46px;flex:1 1 145px;border:1px solid rgba(108,99,255,.35);border-radius:10px;background:rgba(108,99,255,.13);color:#e0e7ff;font:800 .84rem var(--font);cursor:pointer;padding:11px 14px;transition:background .18s,border-color .18s; }
    .stream-controls button:disabled { opacity:.45;cursor:not-allowed; }
    .stream-controls button:not(:disabled):hover { background:rgba(108,99,255,.24);border-color:var(--accent); }
    .stream-controls .end-stream { background:rgba(220,38,38,.15);border-color:rgba(239,68,68,.4);color:#fecaca; }
    .stream-title-input { width:100%;margin:0 22px 14px;padding:12px 14px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font:600 .9rem var(--font);outline:none; }
    .stream-title-input:focus { border-color:var(--accent); }
    .stream-status { min-height:20px;padding:0 22px 16px;color:var(--text-muted);font-size:.78rem; }
    .stream-chat-panel { display:flex;flex-direction:column;min-height:0; }
    .chat-panel-heading { height:58px;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--border);font:800 1rem var(--font-display); }
    .chat-panel-heading span:last-child { color:var(--text-muted);font:700 .72rem var(--font); }
    .stream-chat-frame { width:100%;height:100%;min-height:600px;flex:1;border:0;background:var(--bg); }
    .stream-notice { margin-top:16px;padding:12px 15px;border:1px solid var(--border);border-radius:10px;color:var(--text-muted);font-size:.78rem;line-height:1.5; }
    @media(max-width:900px) { .live-layout{grid-template-columns:1fr;min-height:0}.stream-chat-panel{height:560px}.stream-chat-frame{min-height:0}.stream-page{padding:20px 14px 35px} }
    @media(max-width:520px) { .stream-heading{align-items:flex-start;flex-direction:column}.stream-details{padding:17px}.stream-controls{padding:0 17px 17px}.stream-title-input{margin:0 17px 12px;width:calc(100% - 34px)}.stream-status{padding:0 17px 14px} }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="../" class="logo">NAGames</a>
      <nav>
        <ul>
          <li><a href="../">Home</a></li>
          <li><a href="../games/">Stuff</a></li>
          <li><a href="../stream/">Live</a></li>
          <li><a href="../omoggle/">Omoggle</a></li>
          <li><a href="../chat/">Chat</a></li>
          <li><a href="../settings/">Settings</a></li>
          <li id="auth-button-container"></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="stream-page">
    <div class="stream-heading">
      <div><h1>Live</h1></div>
      
    </div>

    <div class="live-layout">
      <section class="stream-column">
        <div class="video-shell">
          <video id="stream-video" autoplay playsinline controls></video>
          <div class="video-empty" id="video-empty">
            <div class="video-empty-icon">▶</div>
            <strong>Nobody is live right now</strong>
            <span>When someone goes live, the live session will appear here.</span>
          </div>
          <div class="live-indicator" id="live-indicator"><span class="live-dot"></span> LIVE</div>
          <div class="viewer-counter" id="viewer-counter">0 viewers</div>
        </div>

        <div class="stream-details">
          <div class="stream-title" id="stream-title">No active stream</div>
          <div class="streamer-row">
            <div class="streamer-avatar" id="streamer-avatar">N</div>
            <div>
              <div class="streamer-name" id="streamer-name">NAGames</div>
              <div class="streamer-subtitle" id="streamer-subtitle">Waiting for a streamer</div>
              <div class="profile-tags" id="streamer-tags"></div>
            </div>
          </div>
        </div>

        <input id="stream-title-input" class="stream-title-input" maxlength="100" placeholder="Live title (optional)" hidden>
        <div class="stream-controls" id="stream-controls" hidden>
          <button id="front-camera-btn" type="button">Go live with front camera</button>
          <button id="back-camera-btn" type="button">Go live with back camera</button>
          <button id="screen-share-btn" type="button">Share screen live</button>
        </div>
        <div class="stream-controls" id="end-controls" hidden>
          <button id="end-stream-btn" class="end-stream" type="button">End live</button>
        </div>
        <div class="stream-status" id="stream-status" role="status"></div>
      </section>

      <aside class="stream-chat-panel">
        <div class="chat-panel-heading"><span>Live Chat</span><span>Separate live chat</span></div>
        <iframe class="stream-chat-frame" title="Live stream chat" src="../chat/?channel=10000000-0000-4000-8000-000000000004&amp;embed=stream"></iframe>
      </aside>
    </div>

  </main>

  <script type="module">
    import { createClient } from "../assets/backend-client.js";
    const backend = createClient();
    const $ = id => document.getElementById(id);
    const clientId = crypto.randomUUID ? crypto.randomUUID() : "client-" + Date.now() + "-" + Math.random().toString(36).slice(2);
    const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    let user = null;
    let profile = null;
    let role = "user";
    let hostChannel = null;
    let viewerChannel = null;
    let hostChannelReady = false;
    let viewerChannelReady = false;
    let realtimeReady = false;
    let localStream = null;
    let activeHost = null;
    let hostPeerConnections = new Map();
    let hostPendingIce = new Map();
    let viewerPeerConnection = null;
    let pendingIce = [];
    let isHost = false;
    let activeStreamId = null;
    let remoteStream = null;
    let profileTags = [];
    const avatarUrlCache = new Map();

    function setStatus(message, error) {
      $("stream-status").textContent = message || "";
      $("stream-status").style.color = error ? "#fca5a5" : "var(--text-muted)";
    }
    function setConnection() {}
    function setViewerCount() {
      if (!viewerChannel) return;
      const state = viewerChannel.presenceState();
      let count = 0;
      Object.values(state).flat().forEach(item => {
        if (item.kind === "viewer" && item.streamId === activeStreamId) count++;
      });
      $("viewer-counter").textContent = count + (count === 1 ? " viewer" : " viewers");
    }
    function findHosts() {
      if (!hostChannel) return [];
      const state = hostChannel.presenceState();
      return Object.values(state).flat().filter(entry => entry.kind === "streamer" && entry.streamId)
        .sort((a,b) => String(a.clientId || "").localeCompare(String(b.clientId || "")));
    }
    function findHost() {
      return findHosts()[0] || null;
    }
    function updateHostUI(host) {
      activeHost = host;
      activeStreamId = host?.streamId || null;
      $("video-empty").style.display = host ? "none" : "flex";
      $("live-indicator").classList.toggle("active", !!host);
      $("stream-title").textContent = host?.title || "No active stream";
      $("streamer-name").textContent = host?.username || "NAGames";
      $("streamer-subtitle").textContent = host ? "Streaming now" : "Waiting for a streamer";
      $("streamer-avatar").textContent = (host?.username || "N").slice(0,1).toUpperCase();
      renderStreamerTags(host);
      loadAvatarForUser(host?.streamerId).then(url => {
        if (url && activeHost?.streamId === host?.streamId) setStreamerAvatar(url, host?.username);
      });
      $("stream-controls").hidden = !!host || !canStream();
      $("stream-title-input").hidden = !!host || !canStream();
      $("end-controls").hidden = !(isHost && !!host);
      if (!host) {
        $("stream-video").srcObject = null;
        $("viewer-counter").textContent = "0 viewers";
      }
      setViewerCount();
    }
    function setStreamerAvatar(url, username) {
      const avatar = $("streamer-avatar");
      avatar.textContent = "";
      avatar.style.background = "linear-gradient(135deg,#2563eb,#7c3aed)";
      const img = document.createElement("img");
      img.src = url;
      img.alt = (username || "Streamer") + " profile picture";
      img.style.cssText = "width:100%;height:100%;object-fit:cover;border-radius:50%";
      img.onerror = () => { avatar.textContent = (username || "S").slice(0,1).toUpperCase(); };
      avatar.replaceChildren(img);
    }
    let avatarFileIndexPromise = null;
    async function getAvatarFileIndex() {
      if (avatarFileIndexPromise) return avatarFileIndexPromise;
      avatarFileIndexPromise = (async () => {
        const { data, error } = await backend.storage.from("chat-files").list("avatars", { limit:1000, sortBy:{column:"name",order:"desc"} });
        if (error || !data) throw error || new Error("Avatar listing unavailable");
        const latest = new Map();
        data.forEach(item => {
          const match = item.name?.match(/^(.+?)__(\d+)\.(jpg|jpeg|png|webp)$/i);
          if (!match) return;
          const timestamp = Number(match[2]) || 0;
          const old = latest.get(match[1]);
          if (!old || timestamp > old.timestamp) latest.set(match[1], { fileName:item.name, timestamp });
        });
        const entries = Array.from(latest.entries());
        return entries.map(([userId, entry]) => ({ userId, ...entry }));
      })().catch(error => {
        avatarFileIndexPromise = null;
        throw error;
      });
      return avatarFileIndexPromise;
    }
    async function loadAvatarForUser(userId) {
      if (!userId) return null;
      if (avatarUrlCache.has(userId)) return avatarUrlCache.get(userId);
      try {
        const entries = await getAvatarFileIndex();
        const entry = entries.find(item => item.userId === userId);
        if (!entry) return null;
        const url = backend.storage.from("chat-files").getPublicUrl("avatars/" + entry.fileName).data.publicUrl;
        avatarUrlCache.set(userId,url);
        return url;
      } catch (_) { return null; }
    }
    function renderStreamerTags(host) {
      const root = $("streamer-tags");
      root.replaceChildren();
      const roleTag = document.createElement("span");
      roleTag.className = host?.role === "streamer" ? "streamer-role" : "profile-tag";
      roleTag.textContent = String(host?.role || "streamer").toUpperCase();
      root.appendChild(roleTag);
      const tags = Array.isArray(host?.tags) ? host.tags : [];
      tags.forEach(item => {
        const tag = document.createElement("span");
        tag.className = "profile-tag";
        const label = typeof item === "string" ? item : (item.label || item.name || "Tag");
        tag.textContent = String(label);
        const color = typeof item === "object" && /^#[0-9a-f]{6}$/i.test(String(item.color || "")) ? item.color : "";
        if (color) {
          tag.style.color = color;
          tag.style.border = "1px solid " + color + "55";
        }
        root.appendChild(tag);
      });
      if (host?.grade) {
        const grade = document.createElement("span");
        grade.className = "profile-tag";
        grade.textContent = String(host.grade).toUpperCase() + " GRADE";
        root.appendChild(grade);
      }
    }
    function canStream() {
      return role === "admin" || role === "owner" || role === "streamer";
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch]));
    }
    function sendSignal(payload) {
      const channel = isHost ? hostChannel : viewerChannel;
      if (!channel) return Promise.resolve();
      return channel.send({ type:"broadcast", event:"signal", payload:Object.assign({ streamId:activeStreamId, from:clientId }, payload) });
    }
    function closeViewerConnection() {
      if (viewerPeerConnection) {
        try { viewerPeerConnection.close(); } catch (_) {}
        viewerPeerConnection = null;
      }
      pendingIce = [];
      remoteStream = null;
      $("stream-video").srcObject = null;
    }
    function closeHostConnections() {
      hostPeerConnections.forEach(pc => { try { pc.close(); } catch (_) {} });
      hostPeerConnections.clear();
      hostPendingIce.clear();
    }
    async function addQueuedIce(pc) {
      if (!pc.remoteDescription) return;
      const queued = pendingIce;
      pendingIce = [];
      for (const candidate of queued) {
        try { await pc.addIceCandidate(candidate); } catch (error) { console.warn("Could not add queued ICE candidate", error); }
      }
    }
    async function createHostPeer(viewerId) {
      if (!localStream || hostPeerConnections.has(viewerId)) return;
      hostPendingIce.set(viewerId, []);
      const pc = new RTCPeerConnection(rtcConfig);
      hostPeerConnections.set(viewerId, pc);
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      pc.onicecandidate = event => {
        if (event.candidate) sendSignal({ type:"ice", to:viewerId, candidate:event.candidate });
      };
      pc.onconnectionstatechange = () => {
        if (["failed","closed","disconnected"].includes(pc.connectionState)) {
          if (pc.connectionState !== "disconnected") {
            pc.close();
            hostPeerConnections.delete(viewerId);
          hostPendingIce.delete(viewerId);
          }
        }
      };
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await sendSignal({ type:"offer", to:viewerId, description:pc.localDescription });
    }
    async function createViewerPeer(hostClientId) {
      const queuedCandidates = pendingIce;
      closeViewerConnection();
      pendingIce = queuedCandidates;
      const pc = new RTCPeerConnection(rtcConfig);
      viewerPeerConnection = pc;
      pc.ontrack = event => {
        remoteStream = event.streams[0] || remoteStream;
        if (!remoteStream) {
          remoteStream = new MediaStream();
          remoteStream.addTrack(event.track);
        }
        $("stream-video").srcObject = remoteStream;
        $("stream-video").muted = false;
        $("stream-video").play().catch(() => {});
        $("video-empty").style.display = "none";
      };
      pc.onicecandidate = event => {
        if (event.candidate) sendSignal({ type:"ice", to:hostClientId, candidate:event.candidate });
      };
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "failed") setStatus("The video connection failed. Try refreshing the page.", true);
      };
      return pc;
    }
    async function handleSignal(payload) {
      if (!payload || payload.streamId !== activeStreamId) return;
      if (isHost) {
        if (payload.type === "join" && payload.viewerId && payload.viewerId !== clientId) {
          await createHostPeer(payload.viewerId);
        } else if (payload.type === "answer" && payload.to === clientId) {
          const pc = hostPeerConnections.get(payload.from);
          if (pc && payload.description) {
            try {
              await pc.setRemoteDescription(payload.description);
              const queued = hostPendingIce.get(payload.from) || [];
              hostPendingIce.delete(payload.from);
              for (const candidate of queued) await pc.addIceCandidate(candidate);
            } catch (error) { console.warn("Could not set viewer answer", error); }
          }
        } else if (payload.type === "ice" && payload.to === clientId && payload.candidate) {
          const pc = hostPeerConnections.get(payload.from);
          if (pc) {
            if (!pc.remoteDescription) hostPendingIce.get(payload.from)?.push(payload.candidate);
            else { try { await pc.addIceCandidate(payload.candidate); } catch (error) { console.warn("Could not add viewer ICE", error); } }
          }
        } else if (payload.type === "leave" && payload.viewerId) {
          const pc = hostPeerConnections.get(payload.viewerId);
          if (pc) pc.close();
          hostPeerConnections.delete(payload.viewerId);
        }
        return;
      }
      if (payload.type === "ended") {
        closeViewerConnection();
        updateHostUI(null);
        setStatus("The live session ended.");
        return;
      }
      if (payload.to !== clientId) return;
      if (payload.type === "offer" && payload.description) {
        const pc = await createViewerPeer(payload.from);
        await pc.setRemoteDescription(payload.description);
        await addQueuedIce(pc);
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await sendSignal({ type:"answer", to:payload.from, description:pc.localDescription });
      } else if (payload.type === "ice" && payload.candidate) {
        if (!viewerPeerConnection || !viewerPeerConnection.remoteDescription) pendingIce.push(payload.candidate);
        else {
          try { await viewerPeerConnection.addIceCandidate(payload.candidate); } catch (error) { console.warn("Could not add host ICE", error); }
        }
      }
    }
    async function startViewer(host) {
      if (!host || isHost || activeStreamId !== host.streamId) return;
      closeViewerConnection();
      if (!viewerChannelReady) return;
      await viewerChannel.track({ kind:"viewer", streamId:host.streamId, userId:user?.id || null, clientId });
      await sendSignal({ type:"join", to:host.clientId, viewerId:clientId, viewerUserId:user?.id || null });
      setViewerCount();
    }
    async function syncPresence() {
      if (!hostChannel || !realtimeReady) return;
      const hosts = findHosts();
      const host = hosts[0] || null;
      if (isHost) {
        if (host && host.clientId !== clientId) {
          setStatus("Another person went live at the same time. Your live session was stopped.", true);
          await endStream();
          return;
        }
        updateHostUI({ streamId:activeStreamId, streamerId:user?.id, clientId, username:profile?.username || "Streamer", title:$("stream-title").textContent, role:role, tags:profileTags, grade:profile?.grade || "" });
      } else if (host) {
        const changed = activeStreamId !== host.streamId;
        updateHostUI(host);
        if (changed || !viewerPeerConnection) await startViewer(host);
      } else {
        if (activeStreamId) {
          closeViewerConnection();
          activeStreamId = null;
          activeHost = null;
        }
        updateHostUI(null);
        if (canStream()) setStatus("You're allowed to go live. Start when you're ready.");
      }
      setViewerCount();
    }
    async function startStream(source) {
      if (!canStream() || isHost || !realtimeReady) return;
      const existing = findHost();
      if (existing) {
        setStatus("Someone is already live. Only one live session can be active at a time.", true);
        return;
      }
      try {
        if (source === "screen") {
          if (!navigator.mediaDevices?.getDisplayMedia) throw new Error("Screen sharing is not supported by this browser.");
          // Ask the browser to include tab/system audio when the selected surface supports it.
          localStream = await navigator.mediaDevices.getDisplayMedia({ video:{ frameRate:{ ideal:30, max:60 } }, audio:true });
        } else {
          if (!navigator.mediaDevices?.getUserMedia) throw new Error("Camera and microphone access is not supported by this browser.");
          const facingMode = source === "back" ? "environment" : "user";
          try {
            localStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ exact:facingMode }, width:{ ideal:1920 }, height:{ ideal:1080 }, frameRate:{ ideal:30, max:60 } }, audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
          } catch (_) {
            // Keep video working on devices where microphone permission or audio capture is unavailable.
            localStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:facingMode }, width:{ ideal:1920 }, height:{ ideal:1080 } }, audio:false });
          }
        }
        // Screen-share audio is browser-dependent. If it wasn't supplied, try adding the microphone.
        if (!localStream.getAudioTracks().length && navigator.mediaDevices?.getUserMedia) {
          try {
            const microphone = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true }, video:false });
            microphone.getAudioTracks().forEach(track => {
              localStream.addTrack(track);
              track.addEventListener("ended", () => setStatus("Microphone audio stopped; video is still streaming."));
            });
          } catch (audioError) {
            console.warn("Stream audio unavailable:", audioError);
            setStatus("Video is live, but microphone/system audio was not available. Check browser microphone permissions.", true);
          }
        }
        activeStreamId = crypto.randomUUID ? crypto.randomUUID() : "stream-" + Date.now();
        isHost = true;
        $("stream-video").srcObject = localStream;
        $("stream-video").muted = true;
        $("stream-video").play().catch(() => {});
        $("video-empty").style.display = "none";
        $("live-indicator").classList.add("active");
        $("stream-title").textContent = ($("stream-title-input").value || "Live on NAGames").trim();
        $("streamer-name").textContent = profile?.username || "Streamer";
        $("streamer-subtitle").textContent = "Streaming now";
        $("streamer-avatar").textContent = (profile?.username || "S").slice(0,1).toUpperCase();
        renderStreamerTags({ role:role, tags:profileTags, grade:profile?.grade });
        loadAvatarForUser(user.id).then(url => { if (url) setStreamerAvatar(url, profile?.username); });
        $("stream-controls").hidden = true;
        $("stream-title-input").hidden = true;
        $("end-controls").hidden = false;
        await hostChannel.track({ kind:"streamer", streamId:activeStreamId, streamerId:user.id, clientId, username:profile?.username || "Streamer", title:$("stream-title").textContent, role:role, tags:profileTags, grade:profile?.grade || "" });
        try {
          const streamerUsername = profile?.username || user.email?.split("@")[0] || "Streamer";
          const streamTitle = $("stream-title").textContent || "Untitled live session";
          const { error: noticeError } = await backend.from("messages").insert([{
            text: "@everyone @" + streamerUsername + " started streaming! (" + streamTitle + ")",
            username: "Server",
            userId: null,
            role: "system",
            type: "stream_notice",
            server_id: "10000000-0000-4000-8000-000000000001",
            channel_id: "10000000-0000-4000-8000-000000000004"
          }]);
          if (noticeError) console.warn("Could not post stream announcement:", noticeError);
        } catch (noticeError) {
          console.warn("Could not post stream announcement:", noticeError);
        }
        localStream.getVideoTracks()[0].addEventListener("ended", () => { if (isHost) endStream(); });
        setStatus("You're live. Keep this page open while streaming.");
        setViewerCount();
      } catch (error) {
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        localStream = null;
        isHost = false;
        setStatus(error.message || "Could not start the live session.", true);
      }
    }
    async function endStream() {
      if (!isHost) return;
      await sendSignal({ type:"ended" });
      closeHostConnections();
      if (localStream) localStream.getTracks().forEach(track => track.stop());
      localStream = null;
      isHost = false;
      await hostChannel.untrack();
      $("stream-video").srcObject = null;
      $("live-indicator").classList.remove("active");
      $("end-controls").hidden = true;
      $("video-empty").style.display = "flex";
      $("stream-title").textContent = "No active stream";
      $("streamer-name").textContent = "NAGames";
      $("streamer-subtitle").textContent = "Waiting for a streamer";
      $("streamer-avatar").textContent = "N";
      $("streamer-tags").innerHTML = "";
      activeStreamId = null;
      updateHostUI(null);
      setStatus("Live session ended.");
    }

    async function initialize() {
      const authResult = await backend.auth.getUser();
      user = authResult.data?.user || null;
      if (user) {
        const result = await backend.from("users").select("username,role,grade,tags").eq("id",user.id).maybeSingle();
        profile = result.data || { username:user.email?.split("@")[0] || "User", role:"user", tags:[] };
        role = String(profile.role || "user").toLowerCase();
        profileTags = Array.isArray(profile.tags) ? profile.tags : [];
        $("auth-button-container").innerHTML = '<a id="logout-btn" class="nav-auth-btn" href="#">Logout</a>';
        $("logout-btn").addEventListener("click", async event => {
          event.preventDefault();
          try {
            await backend.auth.signOut();
            window.location.reload();
          } catch (error) {
            console.error("Logout error:", error);
            setStatus("Could not log out. Please try again.", true);
          }
        });
        $("streamer-name").textContent = profile.username || "User";
        $("streamer-avatar").textContent = (profile.username || "U").slice(0,1).toUpperCase();
        if (canStream()) {
          $("stream-controls").hidden = false;
          $("stream-title-input").hidden = false;
          setStatus("You're allowed to go live. Choose a camera or screen.");
        } else {
          $("stream-controls").hidden = true;
          $("stream-title-input").hidden = true;
        }
      } else {
        window.location.replace("../login/");
        return;
      }

      if (!user) return;
      if (backend.realtime?.setAuth) await backend.realtime.setAuth();
      hostChannel = backend.channel("nagames-live-stream-host", { config:{ private:true, presence:{ key:clientId } } });
      viewerChannel = backend.channel("nagames-live-stream-viewers", { config:{ private:true, presence:{ key:clientId } } });

      hostChannel
        .on("presence", { event:"sync" }, () => { syncPresence().catch(error => console.warn("Stream host sync failed",error)); })
        .on("presence", { event:"join" }, () => { syncPresence().catch(error => console.warn("Stream host join failed",error)); })
        .on("presence", { event:"leave" }, () => { syncPresence().catch(error => console.warn("Stream host leave failed",error)); })
        .on("broadcast", { event:"signal" }, ({payload}) => { if (!isHost) handleSignal(payload).catch(error => console.warn("Host signaling failed",error)); })
        .subscribe(status => {
          hostChannelReady = status === "SUBSCRIBED";
          realtimeReady = hostChannelReady && viewerChannelReady;
          if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") setConnection("Stream connection problem",true);
          else if (realtimeReady) { setConnection("Connected"); syncPresence().catch(error => console.warn("Initial stream sync failed",error)); }
        });

      viewerChannel
        .on("presence", { event:"sync" }, () => { setViewerCount(); })
        .on("presence", { event:"join" }, () => { setViewerCount(); })
        .on("presence", { event:"leave" }, () => { setViewerCount(); })
        .on("broadcast", { event:"signal" }, ({payload}) => { if (isHost) handleSignal(payload).catch(error => console.warn("Viewer signaling failed",error)); })
        .subscribe(status => {
          viewerChannelReady = status === "SUBSCRIBED";
          realtimeReady = hostChannelReady && viewerChannelReady;
          if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") setConnection("Viewer connection problem",true);
          else if (realtimeReady) { setConnection("Connected"); syncPresence().catch(error => console.warn("Initial stream sync failed",error)); }
        });

      $("front-camera-btn").addEventListener("click", () => startStream("front"));
      $("back-camera-btn").addEventListener("click", () => startStream("back"));
      $("screen-share-btn").addEventListener("click", () => startStream("screen"));
      $("end-stream-btn").addEventListener("click", endStream);
      window.addEventListener("beforeunload", () => {
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        closeHostConnections();
        closeViewerConnection();
        try { hostChannel?.untrack(); } catch (_) {}
        try { viewerChannel?.untrack(); } catch (_) {}
      });
    }
    initialize().catch(error => {
      console.error("Stream page initialization failed:",error);
      setConnection("Could not connect",true);
      setStatus(error.message || "Could not initialize streaming.",true);
    });
  </script>

  <script type="module" src="../assets/chat-notifications.js"></script>
</body>
</html>
